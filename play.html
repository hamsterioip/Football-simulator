<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#080d16" />
<title>Football Life</title>
<meta name="description" content="A football career and life simulator: choose your club, play the big moments, take the penalties, and live the whole career." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%E2%9A%BD</text></svg>" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Football Life" />
<style>
/* css/styles.css */
/* ==========================================================================
   Football Life — stylesheet
   ========================================================================== */
:root{
  --bg:#080d16;
  --bg2:#0d1524;
  --card:#121c2e;
  --card2:#17223a;
  --line:#22304c;
  --txt:#e8eefc;
  --muted:#8fa2c4;
  --dim:#64769a;
  --green:#22e07a;
  --green-d:#12b45f;
  --pitch:#0e7a45;
  --gold:#ffc94d;
  --red:#ff5a6a;
  --blue:#5aa8ff;
  --purple:#b483ff;
  --radius:16px;
  --radius-s:10px;
  --shadow:0 10px 30px rgba(0,0,0,.45);
  --safe-b: env(safe-area-inset-bottom, 0px);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;background:
    radial-gradient(1200px 700px at 50% -12%, #14305a 0%, transparent 60%),
    radial-gradient(900px 500px at 100% 100%, #0d3a28 0%, transparent 55%),
    var(--bg);
  color:var(--txt);
  font:15px/1.5 "Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  overflow:hidden;
}
button,input,select,textarea{font:inherit;color:inherit}
button,.choice,.item.click,.opt,.club,.tabbar button{touch-action:manipulation;user-select:none;-webkit-user-select:none}

/* ---------- screens ---------- */
.screen{position:fixed;inset:0;height:100vh;height:100dvh;display:none;flex-direction:column;overflow:hidden}
.screen.active{display:flex}

/* ---------- generic ---------- */
.btn{
  border:1px solid var(--line);background:var(--card2);color:var(--txt);
  border-radius:var(--radius-s);padding:11px 16px;cursor:pointer;font-weight:600;
  transition:transform .08s ease, filter .15s ease, background .15s ease;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
}
.btn:hover{filter:brightness(1.15)}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn-primary{background:linear-gradient(180deg,var(--green),var(--green-d));border-color:transparent;color:#03260f}
.btn-gold{background:linear-gradient(180deg,#ffd977,#f5b224);border-color:transparent;color:#2b1c00}
.btn-danger{background:linear-gradient(180deg,#ff7a86,#e03a4c);border-color:transparent;color:#2b0006}
.btn-ghost{background:rgba(255,255,255,.04)}
.btn-lg{padding:15px 26px;font-size:16px}
.btn-block{display:flex;width:100%}
.row{display:flex;gap:10px}
.row.wrap{flex-wrap:wrap}
.grow{flex:1}
.center{text-align:center}
.muted{color:var(--muted)}
.dim{color:var(--dim);font-size:13px}
.good{color:var(--green)}
.bad{color:var(--red)}
.gold{color:var(--gold)}
.hidden{display:none !important}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:15px;letter-spacing:.4px;text-transform:uppercase;color:var(--muted)}
.card.tight{padding:12px}

.pill{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.07);
  border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600}
.pill.green{background:rgba(34,224,122,.16);color:var(--green)}
.pill.red{background:rgba(255,90,106,.16);color:var(--red)}
.pill.gold{background:rgba(255,201,77,.16);color:var(--gold)}
.pill.blue{background:rgba(90,168,255,.16);color:var(--blue)}

/* ---------- start screen ---------- */
.start-wrap{margin:auto;text-align:center;padding:24px;max-width:520px}
.start-badge{font-size:76px;filter:drop-shadow(0 8px 24px rgba(34,224,122,.35));animation:bob 3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.start-title{font-size:44px;margin:6px 0 4px;letter-spacing:2px;font-weight:900}
.start-title span{color:var(--green)}
.start-sub{color:var(--muted);margin:0 0 26px}
.start-actions{display:flex;flex-direction:column;gap:10px;max-width:300px;margin:0 auto}
.start-feats{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:28px}
.start-feats span{font-size:12px;color:var(--muted);background:rgba(255,255,255,.05);
  border:1px solid var(--line);border-radius:999px;padding:5px 11px}

/* ---------- create ---------- */
.create-wrap{margin:auto;width:100%;max-width:720px;padding:20px;max-height:100%;overflow-y:auto}
.steps{display:flex;gap:6px;margin-bottom:18px}
.steps div{flex:1;height:4px;border-radius:4px;background:var(--line)}
.steps div.on{background:var(--green)}
.create-nav{display:flex;gap:10px;justify-content:space-between;margin-top:18px;padding-bottom:20px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:6px}
.input,select.input{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius-s);padding:12px 14px}
.input:focus{outline:2px solid var(--green);outline-offset:0}
.opt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.opt{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-s);padding:12px 8px;
  text-align:center;cursor:pointer;transition:.12s;font-weight:600;font-size:13px}
.opt:hover{border-color:var(--green)}
.opt.sel{background:rgba(34,224,122,.14);border-color:var(--green);color:var(--green)}
.opt small{display:block;color:var(--dim);font-weight:500;font-size:11px;margin-top:2px}
.opt.sel small{color:rgba(34,224,122,.75)}

.club-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;max-height:46vh;overflow-y:auto;padding-right:4px}
.club{display:flex;flex-direction:column;gap:2px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--radius-s);padding:10px 12px;cursor:pointer;text-align:left}
.club:hover{border-color:var(--green)}
.club.sel{background:rgba(34,224,122,.13);border-color:var(--green)}
.club.locked{opacity:.35;cursor:not-allowed}
.club b{font-size:13px}
.club span{font-size:11px;color:var(--dim)}

/* ---------- HUD ---------- */
.hud{background:linear-gradient(180deg,rgba(13,21,36,.98),rgba(13,21,36,.86));
  border-bottom:1px solid var(--line);padding:10px 14px;backdrop-filter:blur(12px);flex:0 0 auto}
.hud-top{display:flex;align-items:center;gap:10px}
.hud-avatar{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#1d3a63,#0f6b42);
  display:grid;place-items:center;font-weight:800;font-size:15px;flex:0 0 auto}
.hud-name{font-weight:800;font-size:16px;line-height:1.15}
.hud-meta{font-size:12px;color:var(--muted)}
.hud-ovr{margin-left:auto;text-align:center;background:rgba(255,255,255,.06);border-radius:12px;padding:4px 11px}
.hud-ovr b{display:block;font-size:20px;line-height:1;color:var(--green)}
.hud-ovr span{font-size:9px;letter-spacing:1px;color:var(--muted)}
.hud-bars{display:flex;gap:8px;margin-top:9px}
.bar{flex:1}
.bar-l{display:flex;justify-content:space-between;font-size:10px;color:var(--dim);margin-bottom:3px;text-transform:uppercase;letter-spacing:.5px}
.bar-t{height:5px;background:rgba(255,255,255,.08);border-radius:4px;overflow:hidden}
.bar-f{height:100%;border-radius:4px;transition:width .4s ease}

/* ---------- content + tabs ---------- */
.content{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:14px 14px 90px;-webkit-overflow-scrolling:touch}
.tabbar{position:fixed;bottom:0;left:0;right:0;display:flex;background:rgba(9,14,24,.96);
  border-top:1px solid var(--line);backdrop-filter:blur(12px);padding-bottom:var(--safe-b);z-index:20}
.tabbar button{flex:1;background:none;border:none;padding:9px 2px 11px;color:var(--dim);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:600}
.tabbar button.on{color:var(--green)}
.tabbar button i{font-style:normal;font-size:19px}

/* ---------- home ---------- */
.fixture{background:linear-gradient(135deg,#132a45,#0f2e2a);border:1px solid var(--line);
  border-radius:var(--radius);padding:16px;margin-bottom:12px;position:relative;overflow:hidden}
.fixture:before{content:"";position:absolute;inset:0;background:
  repeating-linear-gradient(90deg,rgba(255,255,255,.03) 0 22px,transparent 22px 44px);pointer-events:none}
.fixture .comp{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--green);font-weight:700}
.fixture .teams{display:flex;align-items:center;justify-content:space-between;margin:12px 0;gap:8px}
.fixture .team{flex:1;text-align:center;font-weight:800;font-size:15px}
.fixture .vs{font-size:12px;color:var(--muted);font-weight:700}
.fixture .venue{font-size:12px;color:var(--muted);text-align:center}

.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;gap:11px;align-items:center;background:var(--card);border:1px solid var(--line);
  border-radius:var(--radius-s);padding:11px 13px}
.item .ic{font-size:20px;flex:0 0 auto}
.item .tx{flex:1;min-width:0}
.item .tx b{display:block;font-size:14px}
.item .tx span{font-size:12px;color:var(--muted);display:block}
.item.click{cursor:pointer;transition:.12s}
.item.click:hover{border-color:var(--green);transform:translateX(2px)}

.news .n{border-left:3px solid var(--line);padding:6px 0 6px 11px;margin-bottom:8px;font-size:13px}
.news .n.good{border-color:var(--green)}
.news .n.bad{border-color:var(--red)}

/* ---------- tables ---------- */
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
table.tbl th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--dim);
  padding:6px 4px;border-bottom:1px solid var(--line);font-weight:700}
table.tbl td{padding:7px 4px;border-bottom:1px solid rgba(255,255,255,.05)}
table.tbl tr.me td{background:rgba(34,224,122,.1);font-weight:700}
table.tbl td.num,table.tbl th.num{text-align:center;width:30px}
.pos-chip{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:6px;
  background:rgba(255,255,255,.07);font-size:11px;font-weight:700;margin-right:6px}
.pos-chip.ucl{background:rgba(90,168,255,.25);color:var(--blue)}
.pos-chip.rel{background:rgba(255,90,106,.25);color:var(--red)}

/* ---------- attributes ---------- */
.attr{margin-bottom:9px}
.attr-h{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.attr-h b{font-variant-numeric:tabular-nums}
.attr-t{height:7px;background:rgba(255,255,255,.08);border-radius:5px;overflow:hidden;position:relative}
.attr-f{height:100%;border-radius:5px;background:linear-gradient(90deg,var(--green-d),var(--green))}
.attr-cap{position:absolute;top:-2px;bottom:-2px;width:2px;background:rgba(255,255,255,.5)}

.trait{display:flex;gap:9px;align-items:center;background:var(--card2);border:1px solid var(--line);
  border-radius:var(--radius-s);padding:9px 11px;margin-bottom:7px}
.trait.bad{border-color:rgba(255,90,106,.5)}
.trait .ic{font-size:19px}
.trait b{font-size:13px;display:block}
.trait span{font-size:11px;color:var(--muted)}

.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:8px}
.stat{background:var(--card2);border:1px solid var(--line);border-radius:var(--radius-s);padding:10px;text-align:center}
.stat b{display:block;font-size:21px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}

/* ---------- match ---------- */
.match-shell{display:flex;flex-direction:column;height:100%;max-width:640px;margin:0 auto;width:100%}
.scoreboard{background:linear-gradient(180deg,#0f2c22,#0b1a2e);border-bottom:1px solid var(--line);
  padding:14px 16px 12px;flex:0 0 auto}
.sb-comp{text-align:center;font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--green);font-weight:700}
.sb-main{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:8px}
.sb-team{flex:1;text-align:center;font-weight:800;font-size:14px;min-width:0}
.sb-score{font-size:34px;font-weight:900;letter-spacing:1px;font-variant-numeric:tabular-nums}
.sb-min{text-align:center;font-size:12px;color:var(--muted);margin-top:5px}
.sb-you{display:flex;gap:6px;justify-content:center;margin-top:9px;flex-wrap:wrap}

.match-feed{flex:1;min-height:64px;overflow-y:auto;overscroll-behavior:contain;padding:14px}
.ev{display:flex;gap:10px;margin-bottom:11px;animation:slidein .25s ease}
@keyframes slidein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.ev .m{flex:0 0 34px;font-size:11px;color:var(--dim);font-weight:700;padding-top:2px;font-variant-numeric:tabular-nums}
.ev .t{flex:1;font-size:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 12px}
.ev.good .t{border-color:rgba(34,224,122,.5);background:rgba(34,224,122,.09)}
.ev.bad .t{border-color:rgba(255,90,106,.45);background:rgba(255,90,106,.08)}
.ev.you .t{border-color:rgba(255,201,77,.5);background:rgba(255,201,77,.08)}

.match-action{flex:0 0 auto;border-top:1px solid var(--line);background:rgba(9,14,24,.97);
  padding:12px 14px calc(14px + var(--safe-b));backdrop-filter:blur(12px);
  max-height:62vh;max-height:62dvh;overflow-y:auto;overscroll-behavior:contain}
.scn{animation:pop .25s ease}
@keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.scn-h{display:flex;gap:10px;align-items:center;margin-bottom:4px}
.scn-h .art{font-size:28px}
.scn-h b{font-size:17px}
.scn-sub{font-size:13px;color:var(--muted);margin-bottom:11px}
.choices{display:flex;flex-direction:column;gap:7px}
.choice{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:11px 13px;cursor:pointer;transition:.12s;display:flex;align-items:center;gap:10px}
.choice:hover{border-color:var(--green);background:var(--card2);transform:translateX(3px)}
.choice .cb{flex:1;min-width:0}
.choice b{display:block;font-size:14px}
.choice span{font-size:11.5px;color:var(--muted)}
.choice .tag{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--green);
  background:rgba(34,224,122,.12);border-radius:6px;padding:3px 7px;font-weight:700;flex:0 0 auto}

/* ---------- modal ---------- */
.modal-back{position:fixed;inset:0;background:rgba(4,8,14,.78);backdrop-filter:blur(6px);
  display:none;align-items:center;justify-content:center;z-index:100;
  padding:18px 18px calc(18px + var(--safe-b))}
.modal-back.on{display:flex}
.modal{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  width:100%;max-width:520px;max-height:88vh;max-height:88dvh;overflow-y:auto;overscroll-behavior:contain;
  padding:20px;box-shadow:var(--shadow);
  animation:pop .2s ease}
.modal h2{margin:0 0 6px;font-size:20px}
.modal p{margin:0 0 14px;color:var(--muted);white-space:pre-line}
.modal .modal-actions{display:flex;flex-direction:column;gap:8px;margin-top:6px}

/* ---------- toasts ---------- */
.toasts{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:200;
  display:flex;flex-direction:column;gap:7px;pointer-events:none;width:calc(100% - 28px);max-width:420px}
.toast{background:rgba(18,28,46,.97);border:1px solid var(--line);border-radius:12px;padding:10px 14px;
  font-size:13px;font-weight:600;box-shadow:var(--shadow);animation:toastin .3s ease}
.toast.good{border-color:var(--green);color:var(--green)}
.toast.bad{border-color:var(--red);color:var(--red)}
.toast.gold{border-color:var(--gold);color:var(--gold)}
@keyframes toastin{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}

/* ---------- misc ---------- */
.section-title{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--dim);
  margin:16px 0 8px;font-weight:700}
.season-row{display:flex;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:13px}
.season-row .yr{font-weight:800;flex:0 0 46px;font-variant-numeric:tabular-nums}
.trophy{display:inline-flex;align-items:center;gap:5px;background:rgba(255,201,77,.13);color:var(--gold);
  border-radius:8px;padding:4px 9px;font-size:12px;font-weight:700;margin:0 5px 5px 0}
.big-num{font-size:40px;font-weight:900;line-height:1}
progress{width:100%}
.divider{height:1px;background:var(--line);margin:14px 0}
.scroll-x{overflow-x:auto}
/* short screens (most phones in portrait): tighten the match UI so even a
   six-option penalty fits on one screen without scrolling */
@media (max-height:720px){
  .scoreboard{padding:10px 14px 9px}
  .sb-score{font-size:27px}
  .sb-main{margin-top:6px;gap:10px}
  .sb-you{margin-top:6px;gap:5px}
  .sb-min{margin-top:3px;font-size:11px}
  .match-action{padding:9px 12px calc(10px + var(--safe-b))}
  .scn-h{margin-bottom:2px}
  .scn-h .art{font-size:22px}
  .scn-h b{font-size:15px}
  .scn-sub{font-size:12px;margin-bottom:8px;line-height:1.35}
  .choices{gap:5px}
  /* five or six options (penalty placement, celebrations) go two-up so the
     whole set is visible at once instead of hiding below the fold */
  .choices.cols{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .choices.cols .choice{flex-direction:column;align-items:stretch;gap:1px}
  .choices.cols .tag{display:none}
  .choices.cols .choice span{font-size:10px;line-height:1.3}
  .choice{padding:8px 11px}
  .choice b{font-size:13px}
  .choice span{font-size:10.5px}
  .ev .t{padding:7px 11px;font-size:13px}
}
@media(min-width:760px){
  .content{padding:20px 20px 100px;max-width:820px;margin:0 auto;width:100%}
  .hud{max-width:820px;margin:0 auto;width:100%;border-radius:0 0 var(--radius) var(--radius)}
  .tabbar{max-width:820px;margin:0 auto;border-radius:var(--radius) var(--radius) 0 0}
}

</style>
</head>
<body>
<!-- ===================== START SCREEN ===================== -->
<div id="screen-start" class="screen active">
  <div class="start-wrap">
    <div class="start-badge">⚽</div>
    <h1 class="start-title">FOOTBALL <span>LIFE</span></h1>
    <p class="start-sub">Career simulator &amp; life sim. One player. One career. Every decision yours.</p>
    <div class="start-actions">
      <button class="btn btn-primary btn-lg" id="btn-new">New Career</button>
      <button class="btn btn-ghost btn-lg" id="btn-continue">Continue Career</button>
      <button class="btn btn-ghost" id="btn-how">How to Play</button>
    </div>
    <div class="start-feats">
      <span>🎯 Penalty shootouts</span><span>🤔 Shoot or pass</span><span>💍 Life &amp; family</span>
      <span>💰 Contracts &amp; sponsors</span><span>🏆 Trophies</span><span>🌍 International football</span>
    </div>
  </div>
</div>

<!-- ===================== CREATE SCREEN ===================== -->
<div id="screen-create" class="screen">
  <div class="create-wrap">
    <div class="steps" id="create-steps"></div>
    <div id="create-body"></div>
    <div class="create-nav">
      <button class="btn btn-ghost" id="create-back">Back</button>
      <button class="btn btn-primary" id="create-next">Next</button>
    </div>
  </div>
</div>

<!-- ===================== MAIN GAME ===================== -->
<div id="screen-game" class="screen">
  <header class="hud" id="hud"></header>
  <main class="content" id="content"></main>
  <nav class="tabbar" id="tabbar"></nav>
</div>

<!-- ===================== MATCH SCREEN ===================== -->
<div id="screen-match" class="screen">
  <div class="match-shell">
    <div class="scoreboard" id="scoreboard"></div>
    <div class="match-feed" id="match-feed"></div>
    <div class="match-action" id="match-action"></div>
  </div>
</div>

<!-- ===================== MODAL ===================== -->
<div class="modal-back" id="modal-back">
  <div class="modal" id="modal"></div>
</div>

<!-- ===================== TOASTS ===================== -->
<div class="toasts" id="toasts"></div>
<script>
/* js/data.js */
/* ==========================================================================
   data.js — static game data: leagues, clubs, names, positions, config
   ========================================================================== */
(function (global) {
  'use strict';

/* js/util.js */
/* ==========================================================================
   util.js — random helpers, formatting, small maths
   ========================================================================== */
(function (global) {
  'use strict';

  const U = {
    rnd(min, max) { return Math.random() * (max - min) + min; },
    int(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; },
    chance(p) { return Math.random() < p; },
    pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; },
    pickN(arr, n) {
      const copy = arr.slice(); const out = [];
      while (out.length < n && copy.length) out.push(copy.splice(Math.floor(Math.random() * copy.length), 1)[0]);
      return out;
    },
    weighted(pairs) { // [[value, weight], ...]
      let total = 0; pairs.forEach(p => total += p[1]);
      let r = Math.random() * total;
      for (const [v, w] of pairs) { r -= w; if (r <= 0) return v; }
      return pairs[pairs.length - 1][0];
    },
    clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); },
    round(v, dp) { const m = Math.pow(10, dp || 0); return Math.round(v * m) / m; },
    // Gaussian-ish via sum of uniforms
    gauss(mean, sd) {
      let s = 0; for (let i = 0; i < 6; i++) s += Math.random();
      return mean + ((s - 3) / 1.2) * sd;
    },
    poisson(lambda) {
      const L = Math.exp(-lambda); let k = 0, p = 1;
      do { k++; p *= Math.random(); } while (p > L);
      return k - 1;
    },
    shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
      return a;
    },
    money(v) {
      const n = Math.round(v);
      const abs = Math.abs(n);
      if (abs >= 1e9) return (n / 1e9).toFixed(2).replace(/\.00$/, '') + 'B';
      if (abs >= 1e6) return (n / 1e6).toFixed(2).replace(/\.00$/, '') + 'M';
      if (abs >= 1e3) return (n / 1e3).toFixed(0) + 'K';
      return String(n);
    },
    cash(v) { return '$' + U.money(v); },
    ordinal(n) {
      const s = ['th', 'st', 'nd', 'rd'], v = n % 100;
      return n + (s[(v - 20) % 10] || s[v] || s[0]);
    },
    pct(v) { return Math.round(v * 100) + '%'; },
    esc(str) {
      return String(str).replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    },
    id() { return Math.random().toString(36).slice(2, 10); }
  };

  global.U = U;
})(window);

<script>
/* js/state.js */
/* ==========================================================================
   state.js — game state: world creation, player creation, save/load, derived
   ========================================================================== */
(function (global) {
  'use strict';
  const D = global.DATA, U = global.U;

  const State = {
    game: null,

    /* ---------------- world ---------------- */
    buildWorld(startYear) {
      const clubs = {};
      const leagues = D.LEAGUES.map(L => {
        const ids = L.clubs.map(([name, rating, prestige]) => {
          const id = L.id + '-' + name.toLowerCase().replace(/[^a-z0-9]+/g, '').slice(0, 12);
          clubs[id] = {
            id, name, rating, baseRating: rating, prestige,
            league: L.id, country: L.country, flag: L.flag,
            morale: 70, form: [], trophies: 0
          };
          return id;
        });
        return { id: L.id, name: L.name, country: L.country, flag: L.flag, tier: L.tier,
                 cup: L.cup, cont: L.cont, clubs: ids };
      });
      return { year: startYear, clubs, leagues };
    },

    league(id) { return this.game.world.leagues.find(l => l.id === id); },
    club(id) { return this.game.world.clubs[id]; },
    clubsOf(leagueId) { return this.league(leagueId).clubs.map(id => this.club(id)); },

    /* ---------------- player ---------------- */
    baseAttrsFor(pos, quality) {
      // quality ~ 0..1 how good the starting kid is
      const base = 38 + quality * 22;
      const a = {};
      D.ATTR_KEYS.forEach(k => { a[k] = Math.round(U.clamp(base + U.gauss(0, 7) - 6, 20, 78)); });
      const w = D.POSITIONS[pos].w;
      // boost the position-relevant attributes
      D.ATTR_KEYS.forEach(k => {
        a[k] = Math.round(U.clamp(a[k] + (w[k] || 0) * 42, 20, 88));
      });
      if (pos !== 'GK') a.gk = U.int(8, 18);
      else { a.gk = Math.round(U.clamp(base + 12 + U.gauss(0, 5), 30, 85)); a.shooting = U.int(15, 30); }
      return a;
    },

    overall(p, pos) {
      const w = D.POSITIONS[pos || p.pos].w;
      let sum = 0;
      D.ATTR_KEYS.forEach(k => sum += (p.attrs[k] || 0) * (w[k] || 0));
      return Math.round(U.clamp(sum, 20, 99));
    },

    createPlayer(opts) {
      const pos = opts.pos;
      const quality = opts.quality != null ? opts.quality : 0.5;
      const p = {
        firstName: opts.firstName, lastName: opts.lastName,
        nation: opts.nation, pos, foot: opts.foot || 'Right',
        age: opts.age || 17,
        height: U.int(pos === 'GK' ? 185 : 168, pos === 'GK' ? 199 : 194),
        attrs: State.baseAttrsFor(pos, quality),
        traits: [],
        fitness: 100, form: 60, morale: 75, happiness: 70, managerTrust: 55,
        fame: 3, discipline: 70, health: 95, followers: 1200,
        money: 25000, wage: 0,
        club: null, contract: null,
        season: State.blankSeason(),
        career: { apps: 0, goals: 0, assists: 0, motm: 0, yellow: 0, red: 0, cleanSheets: 0,
                  trophies: [], ratingSum: 0, seasons: [] },
        intl: { caps: 0, goals: 0, called: false, retired: false },
        relationships: [], assets: [], investments: [], sponsors: [],
        injuries: [], suspension: 0, lastInjury: null,
        achievements: [], legacy: 0, retired: false
      };
      p.potential = U.clamp(State.overall(p) + U.int(12, 30) + Math.round(quality * 14), 58, 99);
      p.ovr = State.overall(p);
      return p;
    },

    blankSeason() {
      return { apps: 0, goals: 0, assists: 0, motm: 0, yellow: 0, red: 0, cleanSheets: 0,
               ratingSum: 0, minutes: 0, benched: 0, keyMoments: 0, earned: 0 };
    },

    seasonRating(p) {
      return p.season.apps ? U.round(p.season.ratingSum / p.season.apps, 2) : 0;
    },
    careerRating(p) {
      return p.career.apps ? U.round(p.career.ratingSum / p.career.apps, 2) : 0;
    },

    marketValue(p) {
      const o = p.ovr, pot = p.potential;
      let v = Math.pow(Math.max(o - 40, 1), 3.05) * 62;
      const ageF = p.age <= 21 ? 1.55 : p.age <= 25 ? 1.3 : p.age <= 28 ? 1.0
                 : p.age <= 31 ? 0.62 : p.age <= 34 ? 0.3 : 0.12;
      v *= ageF;
      v *= 1 + Math.max(0, pot - o) * 0.022;
      v *= 0.8 + (p.form / 100) * 0.45;
      v *= 1 + p.fame / 260;
      if (p.injuries.length) v *= 0.85;
      return Math.round(v / 10000) * 10000;
    },

    hasTrait(p, id) { return p.traits.indexOf(id) >= 0; },
    addTrait(p, id) { if (!State.hasTrait(p, id)) { p.traits.push(id); return true; } return false; },

    addMoney(p, amount) { p.money = Math.max(0, p.money + amount); },

    // Fame has heavy diminishing returns — going from 80 to 90 is far harder
    // than going from 10 to 20, and you cannot be famous for nothing.
    addFame(p, amount) {
      const d = amount > 0 ? amount * (1 - p.fame / 118) : amount;
      p.fame = U.clamp(p.fame + d, 0, 100);
      return p.fame;
    },
    // Follower growth saturates as the audience gets huge
    addFollowers(p, ratePct, flat) {
      const sat = 1 - U.clamp(p.followers / 90000000, 0, 0.96);
      p.followers = Math.round(p.followers * (1 + (ratePct || 0) * sat) + (flat || 0) * sat);
      return p.followers;
    },
    fameBaseline(p, club) {
      return U.clamp((p.ovr - 56) * 2.6 + p.career.trophies.length * 2.5
        + (club ? club.prestige * 3 : 0) + p.career.goals * 0.05, 0, 100);
    },

    /* ---------------- new game ---------------- */
    newGame(playerOpts, clubId) {
      const world = State.buildWorld(D.CONFIG.SEASON_START_YEAR);
      const g = {
        version: 1,
        world,
        player: State.createPlayer(playerOpts),
        seasonIndex: 0,
        log: [],
        news: [],
        fixtures: [],
        fixtureIndex: 0,
        tables: {},
        cup: null,
        cont: null,
        intlTournament: null,
        weekActionsLeft: 1,
        awards: [],
        history: [],
        settings: { difficulty: playerOpts.difficulty || 'normal' },
        stage: 'season'
      };
      State.game = g;
      const club = world.clubs[clubId];
      Contracts.joinClub(g.player, club, Contracts.offerFor(g.player, club, true));
      return g;
    },

    log(text, kind) {
      const g = State.game; if (!g) return;
      g.log.unshift({ t: text, k: kind || 'info', season: g.world.year, id: U.id() });
      if (g.log.length > 400) g.log.length = 400;
    },
    news(headline, kind) {
      const g = State.game; if (!g) return;
      g.news.unshift({ t: headline, k: kind || 'info', season: g.world.year });
      if (g.news.length > 60) g.news.length = 60;
    },

    /* ---------------- persistence ---------------- */
    save() {
      try {
        localStorage.setItem(D.CONFIG.SAVE_KEY, JSON.stringify(State.game));
        return true;
      } catch (e) { console.warn('save failed', e); return false; }
    },
    load() {
      try {
        const raw = localStorage.getItem(D.CONFIG.SAVE_KEY);
        if (!raw) return null;
        const g = JSON.parse(raw);
        if (!g || !g.player) return null;
        State.game = g;
        return g;
      } catch (e) { return null; }
    },
    hasSave() { try { return !!localStorage.getItem(D.CONFIG.SAVE_KEY); } catch (e) { return false; } },
    wipe() { try { localStorage.removeItem(D.CONFIG.SAVE_KEY); } catch (e) {} State.game = null; }
  };

  /* ==================== contracts & wages ==================== */
  const Contracts = {
    wageFor(p, club, rookie) {
      const gap = p.ovr - (club.rating - 6);
      let base = Math.pow(Math.max(club.rating - 45, 4), 2.3) * 14;
      base *= U.clamp(1 + gap * 0.055, 0.28, 3.4);
      base *= 1 + p.fame / 220;
      if (rookie) base *= 0.35;
      base *= (0.85 + Math.random() * 0.3);
      return Math.max(600, Math.round(base / 100) * 100); // weekly wage
    },
    offerFor(p, club, rookie) {
      const wage = Contracts.wageFor(p, club, rookie);
      const years = rookie ? U.int(2, 3) : U.int(2, 5);
      return {
        wage, years,
        signingBonus: Math.round(wage * U.int(4, 30)),
        release: Math.round(State.marketValue(p) * U.rnd(1.6, 3.2) / 100000) * 100000,
        goalBonus: Math.round(wage * U.rnd(0.5, 2.5))
      };
    },
    joinClub(p, club, offer) {
      p.club = club.id;
      p.wage = offer.wage;
      p.contract = { wage: offer.wage, years: offer.years, release: offer.release,
                     goalBonus: offer.goalBonus, signed: State.game ? State.game.world.year : 0 };
      p.managerTrust = U.clamp(52 + (p.ovr - club.rating) * 1.5, 20, 88);
      p.happiness = U.clamp(p.happiness + 6, 0, 100);
      if (offer.signingBonus) State.addMoney(p, offer.signingBonus);
    }
  };

  global.State = State;
  global.Contracts = Contracts;
})(window);

</script>
<script>
/* js/scenarios.js */
/* ==========================================================================
   scenarios.js — interactive in-match decision moments
   Every scenario returns options; each option resolves to an effects object
   consumed by engine.js.
   ========================================================================== */
(function (global) {
  'use strict';
  const D = global.DATA, U = global.U, State = global.State;

  /* ---------- helpers ---------- */
  function eff(ctx, attr) {
    const p = ctx.player;
    const raw = p.attrs[attr] || 20;
    const formF = 0.88 + (p.form / 100) * 0.24;
    const fitF = 0.82 + (p.fitness / 100) * 0.22;
    const nerve = ctx.pressure ? (State.hasTrait(p, 'ice') ? 1.0 : 0.94) : 1.0;
    return raw * formF * fitF * nerve;
  }
  function trait(ctx, id) { return State.hasTrait(ctx.player, id); }
  function luck(ctx, p) { return trait(ctx, 'lucky') ? Math.min(0.95, p + 0.05) : p; }
  function odds(value, opposition, k, base) {
    return U.clamp((base || 0.5) + (value - opposition) * (k || 0.014), 0.04, 0.95);
  }
  function E(o) { // effects with defaults
    return Object.assign({
      goal: false, assist: false, teamGoal: false, concede: false, save: false,
      rating: 0, fitness: -1.2, card: null, injuryRisk: 0, fame: 0, morale: 0,
      trust: 0, xp: null, penalty: false, shootout: false, text: '', tone: 'neutral',
      crowd: 0, money: 0
    }, o);
  }
  const GOOD = 'good', BAD = 'bad', NEU = 'neutral';

  /* ==========================================================================
     Scenario definitions
     each: { id, kind, weight(ctx), build(ctx) -> {title, sub, options[]} }
     ========================================================================== */
  const LIB = [];
  function add(def) { LIB.push(def); }

  const ATT = ['ST', 'LW', 'RW', 'CAM'];
  const MID = ['CM', 'CDM', 'CAM'];
  const DEF = ['CB', 'LB', 'RB', 'CDM'];
  function isPos(ctx, list) { return list.indexOf(ctx.player.pos) >= 0; }

  /* ---------- 1. one v one with the keeper ---------- */
  add({
    id: 'one_on_one', kind: 'shot',
    weight: ctx => isPos(ctx, ATT) ? 3 : isPos(ctx, MID) ? 1.2 : 0.3,
    build(ctx) {
      const gk = ctx.keeper;
      return {
        title: 'One-on-one!',
        sub: `You are clean through with only the keeper to beat. ${ctx.oppName}'s goalkeeper narrows the angle…`,
        art: '🥅',
        options: [
          { label: 'Blast it', hint: 'Power. Simple. Risky if he stands tall.', tag: 'Shooting',
            run() {
              const p = luck(ctx, odds(eff(ctx, 'shooting') + (trait(ctx, 'clinical') ? 8 : 0), gk, 0.016, 0.47));
              if (U.chance(p)) return E({ goal: true, rating: 1.6, tone: GOOD, xp: { shooting: .5 }, crowd: 8,
                text: 'You smash it straight through him. The net rips. GOAL!' });
              return E({ rating: -0.5, tone: BAD, xp: { shooting: .2 },
                text: 'The keeper stands big and it cannons off his chest. Huge chance gone.' });
            } },
          { label: 'Round the keeper', hint: 'High risk, high reward showboat.', tag: 'Dribbling',
            run() {
              let p = odds(eff(ctx, 'dribbling'), gk + 6, 0.017, 0.46);
              if (trait(ctx, 'showman')) p += 0.08;
              p = luck(ctx, p);
              if (U.chance(p)) return E({ goal: true, rating: 1.9, fame: 1.2, crowd: 14, tone: GOOD,
                xp: { dribbling: .6 }, text: 'You drop the shoulder, glide around him and roll it in. Ice cold.' });
              if (U.chance(0.35)) return E({ rating: -0.7, tone: BAD, injuryRisk: 0.12, xp: { dribbling: .2 },
                text: 'He reads it and takes your legs — no penalty given, and you land badly.' });
              return E({ rating: -0.6, tone: BAD, xp: { dribbling: .2 },
                text: 'Too heavy a touch. The keeper smothers it at your feet.' });
            } },
          { label: 'Dink it over him', hint: 'Composure and touch.', tag: 'Composure',
            run() {
              let p = odds((eff(ctx, 'shooting') + eff(ctx, 'dribbling')) / 2, gk + 2, 0.016, 0.5);
              if (trait(ctx, 'ice')) p += 0.07;
              p = luck(ctx, p);
              if (U.chance(p)) return E({ goal: true, rating: 1.8, fame: 1.5, crowd: 12, tone: GOOD,
                xp: { shooting: .45 }, text: 'A cheeky dink, floating over the diving keeper. The away end loses it.' });
              return E({ rating: -0.8, tone: BAD, text: 'You scoop it over the bar. The bench holds their heads.' });
            } },
          { label: 'Square it to the striker', hint: 'The unselfish ball. Assist or nothing.', tag: 'Passing',
            run() {
              const p = luck(ctx, odds(eff(ctx, 'passing'), 44, 0.015, 0.62));
              if (U.chance(p)) return E({ assist: true, teamGoal: true, rating: 1.2, morale: 3, trust: 2,
                tone: GOOD, xp: { passing: .5 }, crowd: 7,
                text: 'You slide it across and your strike partner taps into an empty net. Assist!' });
              return E({ rating: -0.4, tone: BAD, xp: { passing: .2 },
                text: 'The pass is cut out by a recovering defender. Everyone groans.' });
            } }
        ]
      };
    }
  });

  /* ---------- 2. shoot or pass at the edge of the box ---------- */
  add({
    id: 'edge_box', kind: 'shot',
    weight: ctx => isPos(ctx, ATT) ? 2.4 : isPos(ctx, MID) ? 2.2 : 0.5,
    build(ctx) {
      return {
        title: 'Edge of the box',
        sub: 'The ball drops to you 20 yards out. A defender is closing. Two team-mates make runs.',
        art: '⚽',
        options: [
          { label: 'Shoot first time', hint: 'Catch it sweet or slice it.', tag: 'Shooting',
            run() {
              let p = odds(eff(ctx, 'shooting') + (trait(ctx, 'clinical') ? 7 : 0), ctx.keeper + 20, 0.015, 0.32);
              p = luck(ctx, p);
              if (U.chance(p)) return E({ goal: true, rating: 2.0, fame: 1.4, crowd: 15, tone: GOOD,
                xp: { shooting: .6 }, text: 'You catch it flush and it flies into the top corner. Goal of the month?' });
              if (U.chance(0.3)) return E({ rating: -0.2, tone: NEU, xp: { shooting: .25 },
                text: 'Well struck, but the keeper claws it round the post. Corner.' });
              return E({ rating: -0.5, tone: BAD, xp: { shooting: .15 },
                text: 'You lean back and hammer it into row Z.' });
            } },
          { label: 'Slide a through ball', hint: 'Find the run behind.', tag: 'Passing',
            run() {
              const p = luck(ctx, odds(eff(ctx, 'passing'), ctx.defender + 6, 0.015, 0.5));
              if (U.chance(p)) {
                if (U.chance(0.62)) return E({ assist: true, teamGoal: true, rating: 1.5, trust: 2, tone: GOOD,
                  xp: { passing: .6 }, crowd: 9, text: 'Perfectly weighted. He rounds the keeper and scores. Assist!' });
                return E({ rating: 0.6, tone: NEU, xp: { passing: .4 },
                  text: 'Gorgeous ball — but he drags the finish wide. You can only laugh.' });
              }
              return E({ rating: -0.4, tone: BAD, text: 'Overhit. The keeper collects easily.' });
            } },
          { label: 'Take a touch, beat your man', hint: 'Create the extra yard.', tag: 'Dribbling',
            run() {
              const p = luck(ctx, odds(eff(ctx, 'dribbling'), ctx.defender + 4, 0.016, 0.48));
              if (U.chance(p)) {
                if (U.chance(0.5)) return E({ goal: true, rating: 2.1, fame: 2, crowd: 16, tone: GOOD,
                  xp: { dribbling: .5, shooting: .3 }, text: 'Touch, shimmy, finish. That is a highlight-reel goal.' });
                return E({ penalty: true, rating: 0.9, tone: GOOD, xp: { dribbling: .4 },
                  text: 'You skin him and he hauls you down. PENALTY!' });
              }
              return E({ rating: -0.6, tone: BAD, fitness: -2, xp: { dribbling: .2 },
                text: 'He nicks it off your toe and the counter is on. Sloppy.' });
            } },
          { label: 'Recycle it back', hint: 'Safe. Keeps possession.', tag: 'Safe',
            run() {
              return E({ rating: 0.1, fitness: -0.6, tone: NEU, xp: { passing: .15 },
                text: 'You roll it back to midfield. Sensible, if unspectacular. A few whistles.' });
            } }
        ]
      };
    }
  });

  /* ---------- 3. header from a cross ---------- */
  add({
    id: 'header', kind: 'shot',
    weight: ctx => isPos(ctx, ['ST', 'CB']) ? 2 : isPos(ctx, ATT) ? 1 : 0.6,
    build(ctx) {
      return {
        title: 'Cross comes in',
        sub: 'It is whipped towards the six-yard box and you rise above your marker.',
        art: '🙆',
        options: [
          { label: 'Power header', hint: 'Neck muscles and aggression.', tag: 'Physical',
            run() {
              const p = luck(ctx, odds((eff(ctx, 'physical') + eff(ctx, 'shooting')) / 2, ctx.keeper + 8, 0.015, 0.4));
              if (U.chance(p)) return E({ goal: true, rating: 1.7, crowd: 10, tone: GOOD, xp: { physical: .4, shooting: .3 },
                text: 'You bullet it downwards and it bounces up into the roof of the net!' });
              return E({ rating: -0.3, tone: BAD, text: 'You get too much on it and it sails over.' });
            } },
          { label: 'Placed header', hint: 'Direct it into the corner.', tag: 'Technique',
            run() {
              const p = luck(ctx, odds(eff(ctx, 'shooting'), ctx.keeper + 4, 0.015, 0.42));
              if (U.chance(p)) return E({ goal: true, rating: 1.7, crowd: 9, tone: GOOD, xp: { shooting: .45 },
                text: 'Cushioned into the far corner. The keeper never moved.' });
              return E({ rating: -0.25, tone: BAD, text: 'Straight at the keeper. Comfortable save.' });
            } },
          { label: 'Cheeky flick-on', hint: 'Glance it for a runner.', tag: 'Flair',
            run() {
              let p = odds(eff(ctx, 'passing'), 48, 0.014, 0.45) + (trait(ctx, 'showman') ? .08 : 0);
              if (U.chance(luck(ctx, p))) return E({ assist: true, teamGoal: true, rating: 1.3, fame: .6, tone: GOOD,
                xp: { passing: .4 }, text: 'The faintest flick — and your team-mate nods in behind you. Assist!' });
              return E({ rating: -0.2, tone: NEU, text: 'The flick finds nobody. Cleared.' });
            } }
        ]
      };
    }
  });

  /* ---------- 4. penalty ---------- */
  function penaltyOptions(ctx, onResult) {
    const gk = ctx.keeper;
    const skill = (eff(ctx, 'shooting') * 0.7 + (ctx.player.attrs.dribbling || 40) * 0.3)
      + (trait(ctx, 'ice') ? 12 : 0);
    const mk = (label, hint, base, tag) => ({
      label, hint, tag,
      run() {
        let p = luck(ctx, U.clamp(base + (skill - gk) * 0.006, 0.25, 0.96));
        if (ctx.pressure) p -= 0.05;
        const scored = U.chance(p);
        return onResult(scored, label);
      }
    });
    return [
      mk('Bottom left', 'Side-footed, low and hard.', 0.80, 'Placement'),
      mk('Top left', 'Unsaveable if you get it right.', 0.72, 'Risk'),
      mk('Straight down the middle', 'Nerve of steel required.', 0.74, 'Nerve'),
      mk('Bottom right', 'The classic. Keeper might guess.', 0.80, 'Placement'),
      mk('Top right', 'Postage stamp or the stands.', 0.72, 'Risk'),
      mk('Panenka', 'Chip it. Legend or clown.', 0.58, 'Icon')
    ];
  }

  add({
    id: 'penalty', kind: 'set', explicitOnly: true,
    weight: () => 0,
    build(ctx) {
      return {
        title: 'PENALTY',
        sub: `${ctx.minute}' — you place the ball on the spot. ${(ctx.crowdHostile ? 'The whole stadium is whistling.' : 'Your fans hold their breath.')}`,
        art: '🎯',
        options: penaltyOptions(ctx, (scored, label) => {
          if (scored) {
            const icon = label === 'Panenka';
            return E({ goal: true, rating: 1.4, fame: icon ? 3 : 0.8, crowd: icon ? 18 : 10, tone: GOOD,
              xp: { shooting: .35 },
              text: icon ? 'You chip it straight down the middle as he dives. Absolute audacity — and it works.'
                         : 'Sent the keeper the wrong way. Cool as you like.' });
          }
          if (U.chance(0.45)) return E({ rating: -1.4, morale: -8, tone: BAD, fame: -0.5,
            text: 'SAVED! He guessed right and pushed it away. You cannot look up.' });
          return E({ rating: -1.5, morale: -10, tone: BAD, fame: -0.5,
            text: 'You drag it wide of the post. That will be on every highlight show tonight.' });
        })
      };
    }
  });

  /* ---------- 5. free kick ---------- */
  add({
    id: 'free_kick', kind: 'set',
    weight: ctx => (ctx.player.attrs.shooting > 60 || ctx.player.attrs.passing > 65) ? 1.4 : 0.5,
    build(ctx) {
      return {
        title: 'Free kick, 22 yards',
        sub: 'The wall lines up. The keeper shouts. It is your call — you are on set pieces today.',
        art: '🌀',
        options: [
          { label: 'Curl it over the wall', hint: 'Whip and dip.', tag: 'Technique',
            run() {
              let p = odds(eff(ctx, 'shooting') + (trait(ctx, 'wizard') ? 12 : 0), ctx.keeper + 26, 0.014, 0.3);
              if (U.chance(luck(ctx, p))) return E({ goal: true, rating: 2.2, fame: 2.5, crowd: 18, tone: GOOD,
                xp: { shooting: .6 }, text: 'Over the wall, dipping, top bins. The stadium erupts. What a hit!' });
              if (U.chance(.25)) return E({ rating: 0.1, tone: NEU, text: 'Off the crossbar! Inches away.' });
              return E({ rating: -0.2, tone: BAD, text: 'The wall does its job. Deflected behind.' });
            } },
          { label: 'Drill it low under the wall', hint: 'They always jump.', tag: 'Cunning',
            run() {
              let p = odds(eff(ctx, 'shooting') + (trait(ctx, 'wizard') ? 10 : 0), ctx.keeper + 30, 0.014, 0.27);
              if (U.chance(luck(ctx, p))) return E({ goal: true, rating: 2.3, fame: 2.2, crowd: 16, tone: GOOD,
                xp: { shooting: .5 }, text: 'Under the jumping wall and in! The keeper is furious with his defenders.' });
              return E({ rating: -0.15, tone: BAD, text: 'Blocked by the one man who stayed down.' });
            } },
          { label: 'Whip it into the box', hint: 'Let the big men attack it.', tag: 'Passing',
            run() {
              const p = luck(ctx, odds(eff(ctx, 'passing') + (trait(ctx, 'wizard') ? 8 : 0), 55, 0.013, 0.42));
              if (U.chance(p)) return E({ assist: true, teamGoal: true, rating: 1.4, tone: GOOD, xp: { passing: .5 },
                text: 'Devilish delivery — your centre-half powers it home. Assist!' });
              return E({ rating: -0.1, tone: NEU, text: 'Claimed by the keeper at the near post.' });
            } },
          { label: 'Let a team-mate take it', hint: 'Zero risk, zero glory.', tag: 'Safe',
            run() {
              if (U.chance(0.18)) return E({ teamGoal: true, rating: 0.2, tone: NEU,
                text: 'Your captain steps up and scores. You applaud… through slightly gritted teeth.' });
              return E({ rating: 0, tone: NEU, text: 'He blazes it over. Maybe you should have taken it.' });
            } }
        ]
      };
    }
  });

  /* ---------- 6. corner ---------- */
  add({
    id: 'corner', kind: 'set',
    weight: ctx => isPos(ctx, ['LW', 'RW', 'CAM', 'CM', 'LB', 'RB']) ? 1.2 : 0.2,
    build(ctx) {
      return {
        title: 'Corner kick',
        sub: 'You jog over to take it. The box is packed and the referee checks his watch.',
        art: '🚩',
        options: [
          { label: 'Whip it near post', hint: 'Attack the first head.', tag: 'Delivery',
            run() {
              const p = luck(ctx, odds(eff(ctx, 'passing') + (trait(ctx, 'wizard') ? 10 : 0), 58, 0.013, 0.4));
              if (U.chance(p)) return E({ assist: true, teamGoal: true, rating: 1.3, tone: GOOD, xp: { passing: .45 },
                text: 'Flicked on at the near post and bundled in. Your assist!' });
              return E({ rating: -0.1, tone: NEU, text: 'Punched clear by the keeper.' });
            } },
          { label: 'Float it to the back post', hint: 'Find the tall lad.', tag: 'Delivery',
            run() {
              const p = luck(ctx, odds(eff(ctx, 'passing') + (trait(ctx, 'wizard') ? 8 : 0), 61, 0.013, 0.38));
              if (U.chance(p)) return E({ assist: true, teamGoal: true, rating: 1.35, tone: GOOD, xp: { passing: .45 },
                text: 'Hangs in the air forever — headed back across and in. Assist!' });
              return E({ rating: -0.1, tone: NEU, text: 'Too deep, out for a goal kick.' });
            } },
          { label: 'Short corner', hint: 'Work an angle.', tag: 'Smart',
            run() {
              const p = luck(ctx, odds(eff(ctx, 'passing'), 50, 0.012, 0.45));
              if (U.chance(p)) return E({ assist: U.chance(.6), teamGoal: true, rating: 1.0, tone: GOOD,
                xp: { passing: .3 }, text: 'The short routine works perfectly and the cutback is finished first time.' });
              return E({ rating: -0.2, tone: BAD, text: 'The short corner breaks down. The crowd hate it.' });
            } },
          { label: 'Go for the Olimpico', hint: 'Straight in. Absurd. Iconic.', tag: 'Audacity',
            run() {
              let p = 0.07 + (eff(ctx, 'passing') - 60) * 0.003 + (trait(ctx, 'wizard') ? .05 : 0)
                + (trait(ctx, 'showman') ? .03 : 0);
              if (U.chance(luck(ctx, U.clamp(p, .02, .3)))) return E({ goal: true, rating: 2.5, fame: 5, crowd: 25,
                tone: GOOD, xp: { passing: .6 }, text: 'STRAIGHT IN FROM THE CORNER! An Olimpico! Nobody can believe it.' });
              return E({ rating: -0.3, tone: NEU, text: 'It curls just past the far post. Ambitious.' });
            } }
        ]
      };
    }
  });

  /* ---------- 7. counter attack ---------- */
  add({
    id: 'counter', kind: 'run',
    weight: ctx => isPos(ctx, ATT) || isPos(ctx, MID) ? 1.6 : 0.6,
    build(ctx) {
      return {
        title: 'Three on two!',
        sub: 'You break from your own half with numbers. The defence is scrambling back.',
        art: '🏃',
        options: [
          { label: 'Drive at them yourself', hint: 'Pace and power.', tag: 'Pace',
            run() {
              const p = luck(ctx, odds(eff(ctx, 'pace'), ctx.defender + 8, 0.016, 0.5));
              if (U.chance(p)) {
                if (U.chance(0.55)) return E({ goal: true, rating: 1.9, crowd: 12, fitness: -3, tone: GOOD,
                  xp: { pace: .4, shooting: .3 }, text: 'You burn past the last man and finish across the keeper!' });
                return E({ penalty: true, rating: 0.9, fitness: -3, tone: GOOD, xp: { pace: .4 },
                  text: 'The last defender cannot live with you and clips your heels. Penalty!' });
              }
              return E({ rating: -0.5, fitness: -3.5, tone: BAD, text: 'You run into traffic and the chance dies.' });
            } },
