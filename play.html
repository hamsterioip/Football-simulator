          { label: 'Bite back', run(g) { const p = P(); p.managerTrust = clamp(p.managerTrust - 18); p.morale = clamp(p.morale + 6);
            Life.bumpTeammates(g, 3);
            return { tone: 'bad', text: 'You tell him exactly what you think. The lads are stunned. You will be on the bench next week.' }; } },
          { label: 'Take it and respond on the pitch', run(g) { const p = P(); p.form = clamp(p.form + 10); p.managerTrust = clamp(p.managerTrust + 6);
            return { tone: 'good', text: 'You say nothing and produce your best forty-five minutes of the season.' }; } },
          { label: 'Ask for a private chat', run(g) { const p = P(); p.managerTrust = clamp(p.managerTrust + 10);
            return { tone: 'good', text: 'You knock on his door on Monday. He respects it — and admits he went too far.' }; } }
        ]},
      { id: 'sponsor_ad', w: 1, title: '🎬 Advert shoot',
        text: 'A brand wants you for a national TV advert. It involves you singing. Badly.',
        options: [
          { label: 'Do it for the money', run(g) { const p = P(); const fee = Math.round(200000 + p.fame * 40000);
            State.addMoney(p, fee); State.addFame(p, 2);
            return { tone: 'good', text: `${U.cash(fee)} for one day's work. The advert is mocked relentlessly. You do not care.` }; } },
          { label: 'Politely decline', run(g) { const p = P(); p.happiness = clamp(p.happiness + 3);
            return { tone: 'neutral', text: 'You keep your dignity. Your agent does not speak to you for a week.' }; } }
        ]},
      { id: 'teammate_beef', w: 1, title: '🥊 Training ground bust-up',
        text: 'A team-mate goes over the top in a training game and squares up to you. Cameras from the club channel are rolling.',
        options: [
          { label: 'Square up', run(g) { const p = P(); State.addFame(p, 2); p.managerTrust = clamp(p.managerTrust - 8);
            Life.bumpTeammates(g, -8);
            return { tone: 'bad', text: 'It takes four people to separate you. The footage leaks within the hour.' }; } },
          { label: 'Laugh it off', run(g) { Life.bumpTeammates(g, 5); const p = P(); p.morale = clamp(p.morale + 3);
            return { tone: 'good', text: 'You help him up and ruffle his hair. The dressing room loves you for it.' }; } },
          { label: 'Nail him in the next drill', run(g) { const p = P(); p.discipline = clamp(p.discipline - 5);
            return U.chance(0.3) ? { tone: 'bad', text: 'You catch him — and he is out for three weeks. The manager is furious.' }
                                 : { tone: 'neutral', text: 'A firm but fair reminder. Nothing more is said about it.' }; } }
        ]},
      { id: 'business', w: 1, title: '💼 Business opportunity',
        text: 'An old friend pitches you a "guaranteed" investment in a padel club chain.',
        options: [
          { label: 'Go in big', run(g) { const p = P(); const amt = Math.min(p.money, Math.max(100000, Math.round(p.money * 0.2)));
            State.addMoney(p, -amt);
            if (U.chance(0.42)) { const ret = Math.round(amt * U.rnd(2, 4)); State.addMoney(p, ret);
              return { tone: 'good', text: `It takes off. Your ${U.cash(amt)} turns into ${U.cash(ret)}.` }; }
            return { tone: 'bad', text: `Gone. All ${U.cash(amt)} of it. Your "old friend" stops answering.` }; } },
          { label: 'Small stake only', run(g) { const p = P(); const amt = Math.min(p.money, 50000);
            State.addMoney(p, -amt);
            if (U.chance(0.45)) { State.addMoney(p, amt * 2.5); return { tone: 'good', text: `A tidy ${U.cash(amt * 1.5)} profit.` }; }
            return { tone: 'neutral', text: `You lose ${U.cash(amt)}. An acceptable lesson.` }; } },
          { label: 'Walk away', run() { return { tone: 'neutral', text: 'You say no. Six months later the company collapses. Good call.' }; } }
        ]},
      { id: 'doping', w: 0.5, title: '🧪 Random drug test',
        text: 'Testers arrive at 6:30am. You have been taking a supplement your cousin recommended.',
        options: [
          { label: 'Declare it honestly', run(g) { const p = P();
            return U.chance(0.85) ? { tone: 'good', text: 'It is clean. The doctor tells you to run everything past him in future.' }
              : (p.suspension = 6, { tone: 'bad', text: 'A banned substance. You are provisionally suspended for six matches while it is investigated.' }); } },
          { label: 'Say nothing', run(g) { const p = P();
            return U.chance(0.7) ? { tone: 'neutral', text: 'Nothing comes of it. You bin the supplement anyway.' }
              : (p.suspension = 10, State.addFame(p, -(5), { tone: 'bad', text: 'Positive test. Ten-match ban and a reputation to rebuild.' })); } }
        ]},
      { id: 'loan_offer', w: 0.7, title: '📄 Loan approach',
        text: 'You are not playing much. A club abroad wants you on loan for the rest of the season.',
        options: [
          { label: 'Take the loan', run(g) { const p = P(); p.managerTrust = clamp(p.managerTrust + 20); p.form = clamp(p.form + 8);
            return { tone: 'good', text: 'A change of scenery. You will play every week, and your parent club will be watching.' }; } },
          { label: 'Stay and fight', run(g) { const p = P(); p.morale = clamp(p.morale + 5);
            return { tone: 'neutral', text: 'You tell the manager you are staying and taking his shirt off him.' }; } }
        ]},
      { id: 'fan_award', w: 0.8, title: '🏅 Fans\' Player of the Month',
        text: 'The supporters have voted for you. There is a small ceremony before the next home game.',
        options: [
          { label: 'Give the trophy to a fan', run(g) { const p = P(); State.addFame(p, 2.5); p.happiness = clamp(p.happiness + 6);
            return { tone: 'good', text: 'You hand it to a season-ticket holder in the front row. Instant club folklore.' }; } },
          { label: 'Keep it for the cabinet', run(g) { const p = P(); p.happiness = clamp(p.happiness + 4);
            return { tone: 'good', text: 'It goes on the shelf next to the others. You allow yourself a moment.' }; } }
        ]},
      { id: 'car_crash', w: 0.35, title: '🚗 Late night, wet road',
        text: 'You lose control of the supercar on the way home. Nobody else is hurt, but the car is destroyed.',
        options: [
          { label: 'Report it immediately', run(g) { const p = P();
            p.assets = p.assets.filter(a => a.id !== 'car');
            State.addFame(p, 1.5); p.health = clamp(p.health - 6);
            return { tone: 'bad', text: 'Whiplash and a written-off car, but you did everything right. The club backs you publicly.' }; } },
          { label: 'Try to keep it quiet', run(g) { const p = P();
            p.assets = p.assets.filter(a => a.id !== 'car');
            if (U.chance(0.5)) { State.addFame(p, 4); p.managerTrust = clamp(p.managerTrust - 15);
              return { tone: 'bad', text: 'It gets out, and the cover-up is a bigger story than the crash.' }; }
            return { tone: 'neutral', text: 'Nobody ever finds out. You buy a much more sensible car.' }; } }
        ]},
      { id: 'academy', w: 0.6, title: '🎓 Back to the academy',
        text: 'Your old youth coach asks you to speak to the under-15s for an afternoon.',
        options: [
          { label: 'Spend the whole day there', run(g) { const p = P(); p.happiness = clamp(p.happiness + 9); p.karma = (p.karma || 0) + 1;
            State.addFame(p, 0.6);
            return { tone: 'good', text: 'You stay for training, sign everything, and remember exactly why you started.' }; } },
          { label: 'Send signed shirts instead', run(g) { const p = P(); p.happiness = clamp(p.happiness + 2);
            return { tone: 'neutral', text: 'A nice gesture. Your old coach says he understands. He is a little disappointed.' }; } }
        ]},
      { id: 'agent_switch', w: 0.5, title: '🕴️ A super-agent calls',
        text: 'The most powerful agent in the game wants to represent you. His cut is enormous.',
        options: [
          { label: 'Sign with him', run(g) { const p = P(); p.agentLevel = 3; p.superAgent = true;
            State.addMoney(p, -Math.round(p.money * 0.05));
            return { tone: 'good', text: 'Doors open that you did not know existed. Every transfer window is about to get interesting.' }; } },
          { label: 'Stay loyal to your agent', run(g) { const p = P(); p.happiness = clamp(p.happiness + 5); p.agentLevel = (p.agentLevel || 1) + 1;
            return { tone: 'good', text: 'The man who drove you to trials at 14 stays in charge. That means something.' }; } }
        ]},
      { id: 'burnout', w: 0.6, title: '🧠 You are exhausted',
        text: 'Games every three days, travel, noise. You have not felt like yourself for weeks.',
        options: [
          { label: 'Speak to the club psychologist', run(g) { const p = P(); p.morale = clamp(p.morale + 15); p.happiness = clamp(p.happiness + 10);
            return { tone: 'good', text: 'Talking helps more than you expected. The club handles it well and quietly.' }; } },
          { label: 'Push through it', run(g) { const p = P(); p.morale = clamp(p.morale - 8); p.form = clamp(p.form - 6);
            return { tone: 'bad', text: 'You say nothing. The performances dip and the noise gets louder.' }; } },
          { label: 'Ask for a week off', run(g) { const p = P(); p.fitness = clamp(p.fitness + 20); p.morale = clamp(p.morale + 8);
            p.managerTrust = clamp(p.managerTrust - 6);
            return { tone: 'neutral', text: 'You go away, switch the phone off, and come back a different person.' }; } }
        ]},
      { id: 'tattoo', w: 0.6, title: '🎨 Tattoo appointment',
        text: 'You are booked in for a big new piece down the arm.',
        options: [
          { label: 'Full sleeve', run(g) { const p = P(); State.addMoney(p, -12000); State.addFame(p, 1); p.happiness = clamp(p.happiness + 4);
            return { tone: 'good', text: 'Nine hours under the needle. It looks incredible.' }; } },
          { label: 'Something small and meaningful', run(g) { const p = P(); State.addMoney(p, -1500); p.happiness = clamp(p.happiness + 5);
            return { tone: 'good', text: 'Your family\'s initials, just above the wrist. Quiet and permanent.' }; } },
          { label: 'Cancel it', run() { return { tone: 'neutral', text: 'You reschedule for the summer. Again.' }; } }
        ]},
      { id: 'rival_words', w: 0.7, title: '🗣️ A rival takes a shot at you',
        text: 'An opponent says in a podcast that you are "all highlights, no substance".',
        options: [
          { label: 'Reply on social', run(g) { const p = P(); State.addFame(p, 3); State.addFollowers(p, 0.03, 6000);
            return { tone: 'neutral', text: 'Your reply gets 4 million views. The rivalry is now officially A Thing.' }; } },
          { label: 'Say nothing, circle the date', run(g) { const p = P(); p.form = clamp(p.form + 6); p.rivalGrudge = true;
            return { tone: 'good', text: 'You pin the quote above your locker. You will see him in April.' }; } }
        ]},
      { id: 'wonderkid', w: 0.6, title: '🌟 A 16-year-old arrives',
        text: 'The academy prodigy is training with the first team and playing in your position. He is frighteningly good.',
        options: [
          { label: 'Mentor him', run(g) { const p = P(); Life.bumpTeammates(g, 6); p.managerTrust = clamp(p.managerTrust + 8);
            p.happiness = clamp(p.happiness + 5);
            return { tone: 'good', text: 'You take him under your wing. The staff notice. So does he — he will never forget it.' }; } },
          { label: 'Freeze him out', run(g) { const p = P(); p.managerTrust = clamp(p.managerTrust - 10); Life.bumpTeammates(g, -5);
            return { tone: 'bad', text: 'You barely pass to him. It is noticed, and it does not reflect well on you.' }; } },
          { label: 'Raise your own level', run(g) { const p = P(); p.form = clamp(p.form + 10);
            const attr = U.pick(Object.keys(D.POSITIONS[p.pos].w).filter(k => D.POSITIONS[p.pos].w[k] > 0.2));
            Engine.Progress.addXp(p, attr, 4);
            return { tone: 'good', text: 'Competition is fuel. You train like a man possessed for a month.' }; } }
        ]},
      { id: 'boots_deal', w: 0.5, title: '👟 Boot deal renewal',
        text: 'Your boot sponsor wants to renew — but they want you in a garish new colourway.',
        options: [
          { label: 'Wear the pink ones', run(g) { const p = P(); const fee = Math.round(150000 + p.fame * 25000);
            State.addMoney(p, fee); State.addFame(p, 1.5);
            return { tone: 'good', text: `${U.cash(fee)} and everyone will see you from space.` }; } },
          { label: 'Negotiate hard', run(g) { const p = P();
            if (U.chance(0.55)) { const fee = Math.round(320000 + p.fame * 45000); State.addMoney(p, fee);
              return { tone: 'good', text: `They blink first. ${U.cash(fee)} and you keep the black boots.` }; }
            return { tone: 'bad', text: 'They walk away. You are wearing blank boots next month.' }; } }
        ]},
      { id: 'family_help', w: 0.6, title: '👨‍👩‍👦 Family asks for help',
        text: 'A relative is in trouble and needs money. It is not the first time.',
        options: [
          { label: 'Give them whatever they need', run(g) { const p = P(); const c = Math.round(Math.max(20000, p.money * 0.06));
            State.addMoney(p, -c); p.happiness = clamp(p.happiness + 6); p.karma = (p.karma || 0) + 1;
            return { tone: 'good', text: `${U.cash(c)} sent without a word. Family is family.` }; } },
          { label: 'Set up a proper allowance', run(g) { const p = P(); const c = Math.round(Math.max(10000, p.money * 0.02));
            State.addMoney(p, -c); p.happiness = clamp(p.happiness + 3);
            return { tone: 'neutral', text: 'You involve an accountant. It is less warm, but it is sustainable.' }; } },
          { label: 'Say no', run(g) { const p = P(); p.happiness = clamp(p.happiness - 8);
            return { tone: 'bad', text: 'You hold firm. The phone calls stop entirely, which is worse.' }; } }
        ]}
    ],

    rollEvent(g) {
      const p = g.player;
      const chance = 0.42 + (p.fame / 300);
      if (!U.chance(chance)) return null;
      const pool = Life.EVENTS.filter(e => {
        if (e.id === 'car_crash' && !p.assets.some(a => a.id === 'car')) return false;
        if (e.id === 'agent_switch' && p.superAgent) return false;
        if (e.id === 'loan_offer' && (p.managerTrust > 45 || p.season.apps > 8)) return false;
        return true;
      });
      if (!pool.length) return null;
      const ev = U.weighted(pool.map(e => [e, e.w || 1]));
      return { id: ev.id, title: ev.title, text: ev.text, options: ev.options };
    },

    /* ================= season upkeep ================= */
    seasonUpkeep(g) {
      const p = g.player, notes = [];
      // sponsor income
      let sponsorIncome = 0;
      p.sponsors.forEach(s => { sponsorIncome += s.annual; s.years--; });
      const expired = p.sponsors.filter(s => s.years <= 0);
      p.sponsors = p.sponsors.filter(s => s.years > 0);
      if (sponsorIncome) { State.addMoney(p, sponsorIncome); notes.push(`Sponsorships paid ${U.cash(sponsorIncome)}.`); }
      expired.forEach(s => notes.push(`${s.name} deal expired.`));

      // staff costs
      let staffCost = 0;
      (p.perks || []).forEach(id => { const perk = Life.PERKS.find(x => x.id === id); if (perk) staffCost += Math.round(perk.cost * 0.4); });
      if (staffCost) { State.addMoney(p, -staffCost); notes.push(`Staff wages cost ${U.cash(staffCost)}.`); }

      // lifestyle upkeep
      const upkeep = p.assets.reduce((s, a) => s + Math.round(a.cost * 0.02), 0);
      if (upkeep) { State.addMoney(p, -upkeep); notes.push(`Lifestyle upkeep cost ${U.cash(upkeep)}.`); }

      // taxes
      const tax = Math.round((p.season.earned || 0) * 0.42);
      if (tax) { State.addMoney(p, -tax); notes.push(`Tax bill: ${U.cash(tax)}.`); }

      // investments mature
      const inv = Life.resolveInvestments(g);
      inv.forEach(i => notes.push(`${i.icon} ${i.name}: ${i.delta >= 0 ? '+' : ''}${U.cash(i.delta)}`));

      // relationship drift
      const partner = Life.partner(g);
      if (partner) {
        partner.level = clamp(partner.level - U.rnd(2, 9) + (p.happiness > 70 ? 4 : 0));
        if (partner.level < 22 && U.chance(0.5)) {
          partner.ended = true;
          p.happiness = clamp(p.happiness - 18);
          notes.push(`💔 ${partner.name} ended things. The travel and the schedule finally won.`);
        }
      }
      // fame drifts back towards what you actually deserve
      const baseline = State.fameBaseline(p, State.club(p.club));
      if (p.fame > baseline) {
        const drop = (p.fame - baseline) * 0.3;
        p.fame = clamp(p.fame - drop);
        if (drop > 6) notes.push(`The spotlight moves on — fame down to ${Math.round(p.fame)}.`);
      }
      p.health = clamp(p.health - (p.age > 30 ? 1.5 : 0.6) + (Life.hasPerk(g, 'chef') ? 1 : 0));
      p.happiness = clamp(p.happiness - 3 + (p.karma || 0) * 0.5);
      return notes;
    },

    /* ================= retirement & legacy ================= */
    legacyScore(g) {
      const p = g.player;
      let s = 0;
      s += p.career.goals * 2.2;
      s += p.career.assists * 1.4;
      s += p.career.apps * 0.5;
      s += p.career.trophies.length * 26;
      s += p.achievements.length * 18;
      s += p.intl.caps * 1.1 + p.intl.goals * 2.4;
      s += p.fame * 3;
      s += Math.max(0, (State.careerRating(p) - 6.5) * 40);
      s += Math.min(120, p.money / 4000000);
      return Math.round(s);
    },
    legacyRank(score) {
      if (score >= 1400) return { title: 'IMMORTAL', desc: 'Statues. Documentaries. Arguments in pubs for the next fifty years.' };
      if (score >= 1000) return { title: 'ALL-TIME GREAT', desc: 'One of the defining players of your generation.' };
      if (score >= 700) return { title: 'SUPERSTAR', desc: 'A genuine icon. Shirts with your name still sell.' };
      if (score >= 450) return { title: 'CLUB LEGEND', desc: 'Adored where it mattered most. They named a stand after you.' };
      if (score >= 250) return { title: 'TOP PROFESSIONAL', desc: 'A long, respected career at a good level.' };
      if (score >= 120) return { title: 'SOLID SQUAD PLAYER', desc: 'You made a living from the game. Most never do.' };
      return { title: 'JOURNEYMAN', desc: 'It did not quite work out — but you were there.' };
    },
    POST_CAREER: [
      { id: 'manager', name: 'Go into management', icon: '📋', text: 'You take your badges and start in the lower leagues. Within a decade you are back in the big time — in a suit this time.' },
      { id: 'pundit',  name: 'TV punditry',        icon: '📺', text: 'You are surprisingly good on camera. Saturday afternoons are yours again, this time with a microphone.' },
      { id: 'academy', name: 'Coach the academy',  icon: '🎓', text: 'You go back to where it started and spend your days making teenagers better. Nothing has ever felt more right.' },
      { id: 'business',name: 'Full-time business', icon: '💼', text: 'Restaurants, property, a padel empire. You are busier than you ever were as a player.' },
      { id: 'beach',   name: 'Disappear entirely', icon: '🏝️', text: 'Phone off. Boat on. Nobody hears from you for four years and you have never been happier.' },
      { id: 'owner',   name: 'Buy your boyhood club', icon: '🏟️', text: 'You put your money where your heart is and take over the club you grew up supporting.' }
    ]
  };

  global.Life = Life;
})(window);

</script>
<script>
/* js/ui.js */
/* ==========================================================================
   ui.js — screens, rendering, modals, the creation wizard
   ========================================================================== */
(function (global) {
  'use strict';
  const D = global.DATA, U = global.U, State = global.State, Engine = global.Engine, Life = global.Life;
  const $ = id => document.getElementById(id);
  const esc = U.esc;

  const UI = {
    tab: 'home',
    wizard: null,

    /* ---------------- screens ---------------- */
    show(name) {
      ['start', 'create', 'game', 'match'].forEach(s => {
        const el = $('screen-' + s);
        if (el) el.classList.toggle('active', s === name);
      });
    },

    toast(text, kind) {
      const el = document.createElement('div');
      el.className = 'toast ' + (kind || '');
      el.textContent = text;
      $('toasts').appendChild(el);
      setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .4s'; }, 2400);
      setTimeout(() => el.remove(), 2900);
    },

    modal(opts) {
      const m = $('modal');
      let html = '';
      if (opts.title) html += `<h2>${opts.title}</h2>`;
      if (opts.text) html += `<p>${esc(opts.text)}</p>`;
      if (opts.html) html += opts.html;
      html += '<div class="modal-actions">';
      (opts.actions || [{ label: 'Continue' }]).forEach((a, i) => {
        html += `<button class="btn ${a.cls || 'btn-primary'}" data-mi="${i}">${a.label}</button>`;
      });
      html += '</div>';
      m.innerHTML = html;
      m.querySelectorAll('[data-mi]').forEach(btn => {
        btn.onclick = () => {
          const a = (opts.actions || [{}])[+btn.dataset.mi];
          if (!a || !a.keepOpen) UI.closeModal();
          if (a && a.onClick) a.onClick();
        };
      });
      if (opts.onRender) opts.onRender(m);
      $('modal-back').classList.add('on');
    },
    closeModal() { $('modal-back').classList.remove('on'); },

    /* ---------------- small render helpers ---------------- */
    trophyLabel(t) { return /\d{4}$/.test(t.name) ? t.name : t.name + ' ' + t.year; },
    bar(label, value, color) {
      const v = U.clamp(value, 0, 100);
      return `<div class="bar"><div class="bar-l"><span>${label}</span><span>${Math.round(v)}</span></div>
        <div class="bar-t"><div class="bar-f" style="width:${v}%;background:${color}"></div></div></div>`;
    },
    attrRow(p, key) {
      const v = p.attrs[key] || 0;
      const cap = Engine.Progress.cap(p, key);
      const xp = (p.xp && p.xp[key]) || 0;
      const need = Engine.Progress.xpNeeded(p, key);
      return `<div class="attr">
        <div class="attr-h"><span>${D.ATTR_LABEL[key]}</span><b>${v}${xp > 0 ? ` <span class="dim">+${Math.round(xp / need * 100)}%</span>` : ''}</b></div>
        <div class="attr-t"><div class="attr-f" style="width:${v}%"></div>
          <div class="attr-cap" style="left:${U.clamp(cap, 0, 100)}%"></div></div></div>`;
    },

    /* ==========================================================================
       CREATION WIZARD
       ========================================================================== */
    startWizard() {
      UI.wizard = {
        step: 0,
        firstName: U.pick(D.FIRST_NAMES),
        lastName: U.pick(D.LAST_NAMES),
        nation: 'England',
        foot: 'Right',
        pos: 'ST',
        talent: 'normal',
        clubId: null
      };
      UI.show('create');
      UI.renderWizard();
    },

    talentPresets: {
      hard:   { label: 'Academy Hopeful', quality: 0.30, money: 5000,  max: 70, desc: 'Raw. Unfancied. You will have to earn everything.' },
      normal: { label: 'Highly Rated',    quality: 0.55, money: 25000, max: 80, desc: 'A proper prospect with a big future.' },
      easy:   { label: 'Generational',    quality: 0.85, money: 90000, max: 92, desc: 'The best teenager in the world. Everyone wants you.' }
    },

    renderWizard() {
      const w = UI.wizard;
      $('create-steps').innerHTML = [0, 1, 2, 3].map(i => `<div class="${i <= w.step ? 'on' : ''}"></div>`).join('');
      const body = $('create-body');
      if (w.step === 0) {
        body.innerHTML = `
          <h2 style="margin:0 0 4px">Who are you?</h2>
          <p class="muted" style="margin:0 0 18px">Every career starts with a name on a team sheet.</p>
          <div class="row"><div class="field grow"><label>First name</label>
            <input class="input" id="w-first" maxlength="14" value="${esc(w.firstName)}"></div>
            <div class="field grow"><label>Surname</label>
            <input class="input" id="w-last" maxlength="16" value="${esc(w.lastName)}"></div></div>
          <div class="field"><label>Nationality</label>
            <select class="input" id="w-nat">${D.NATIONS.map(n =>
              `<option value="${esc(n.name)}" ${n.name === w.nation ? 'selected' : ''}>${n.flag} ${esc(n.name)}</option>`).join('')}</select></div>
          <div class="field"><label>Strong foot</label>
            <div class="opt-grid" data-group="foot">${['Left', 'Right', 'Both'].map(f =>
              `<div class="opt ${w.foot === f ? 'sel' : ''}" data-val="${f}">${f}</div>`).join('')}</div></div>`;
        body.querySelector('#w-first').oninput = e => w.firstName = e.target.value;
        body.querySelector('#w-last').oninput = e => w.lastName = e.target.value;
        body.querySelector('#w-nat').onchange = e => w.nation = e.target.value;
        UI.optGroup(body, 'foot', v => { w.foot = v; UI.renderWizard(); });
      } else if (w.step === 1) {
        body.innerHTML = `
          <h2 style="margin:0 0 4px">Pick your position</h2>
          <p class="muted" style="margin:0 0 18px">This shapes the moments you will face on the pitch — and the ones you will be judged on.</p>
          <div class="opt-grid" data-group="pos">${Object.keys(D.POSITIONS).map(k =>
            `<div class="opt ${w.pos === k ? 'sel' : ''}" data-val="${k}"><b>${k}</b><small>${D.POSITIONS[k].name}</small></div>`).join('')}</div>
          <div class="card" style="margin-top:16px">
            <h3>${D.POSITIONS[w.pos].name}</h3>
            <p class="dim" style="margin:0">Key attributes: ${Object.keys(D.POSITIONS[w.pos].w)
              .filter(k => D.POSITIONS[w.pos].w[k] >= 0.18).map(k => D.ATTR_LABEL[k]).join(', ')}</p>
          </div>`;
        UI.optGroup(body, 'pos', v => { w.pos = v; UI.renderWizard(); });
      } else if (w.step === 2) {
        body.innerHTML = `
          <h2 style="margin:0 0 4px">How good are you already?</h2>
          <p class="muted" style="margin:0 0 18px">This is your difficulty setting. It decides who will sign a 17-year-old you.</p>
          <div class="opt-grid" data-group="talent" style="grid-template-columns:1fr">
            ${Object.keys(UI.talentPresets).map(k => { const t = UI.talentPresets[k];
              return `<div class="opt ${w.talent === k ? 'sel' : ''}" data-val="${k}" style="text-align:left;padding:14px">
                <b>${t.label}</b><small>${t.desc} · Starting bank ${U.cash(t.money)}</small></div>`; }).join('')}
          </div>`;
        UI.optGroup(body, 'talent', v => { w.talent = v; w.clubId = null; UI.renderWizard(); });
      } else {
        const preset = UI.talentPresets[w.talent];
        const world = State.buildWorld(D.CONFIG.SEASON_START_YEAR);
        UI.previewWorld = world;
        body.innerHTML = `
          <h2 style="margin:0 0 4px">Choose your first club</h2>
          <p class="muted" style="margin:0 0 14px">Clubs above your level will not take a chance on you yet. Start low and climb, or take the pressure now.</p>
          <div class="field"><label>League</label>
            <select class="input" id="w-league">${world.leagues.map(l =>
              `<option value="${l.id}">${l.flag} ${esc(l.name)} — ${esc(l.country)}</option>`).join('')}</select></div>
          <div class="club-list" id="w-clubs"></div>`;
        const renderClubs = () => {
          const lid = body.querySelector('#w-league').value;
          const league = world.leagues.find(l => l.id === lid);
          $('w-clubs').innerHTML = league.clubs.map(id => {
            const c = world.clubs[id];
            const locked = c.rating > preset.max;
            return `<div class="club ${locked ? 'locked' : ''} ${w.clubId === id ? 'sel' : ''}" data-club="${id}" ${locked ? 'data-locked="1"' : ''}>
              <b>${esc(c.name)}</b><span>${locked ? '🔒 Out of your league' : 'Squad rating ' + c.rating + ' · ' + '★'.repeat(c.prestige)}</span></div>`;
          }).join('');
          $('w-clubs').querySelectorAll('.club').forEach(el => {
            el.onclick = () => {
              if (el.dataset.locked) { UI.toast('They will not sign you… yet.', 'bad'); return; }
              w.clubId = el.dataset.club; renderClubs();
            };
          });
        };
        body.querySelector('#w-league').onchange = renderClubs;
        renderClubs();
      }
      $('create-back').textContent = w.step === 0 ? 'Cancel' : 'Back';
      $('create-next').textContent = w.step === 3 ? 'Start Career' : 'Next';
    },

    optGroup(root, group, cb) {
      root.querySelectorAll(`[data-group="${group}"] .opt`).forEach(el => {
        el.onclick = () => cb(el.dataset.val);
      });
    },

    /* ==========================================================================
       HUD + TABS
       ========================================================================== */
    renderHUD() {
      const g = State.game, p = g.player, club = State.club(p.club);
      const init = (p.firstName[0] || '?') + (p.lastName[0] || '');
      $('hud').innerHTML = `
        <div class="hud-top">
          <div class="hud-avatar">${esc(init.toUpperCase())}</div>
          <div>
            <div class="hud-name">${esc(p.firstName)} ${esc(p.lastName)}</div>
            <div class="hud-meta">${p.pos} · ${p.age}y · ${club.flag} ${esc(club.name)}</div>
          </div>
          <div class="hud-ovr"><b>${p.ovr}</b><span>OVR</span></div>
        </div>
        <div class="hud-bars">
          ${UI.bar('Fit', p.fitness, 'linear-gradient(90deg,#12b45f,#22e07a)')}
          ${UI.bar('Form', p.form, 'linear-gradient(90deg,#3d8bff,#5aa8ff)')}
          ${UI.bar('Mood', p.morale, 'linear-gradient(90deg,#b483ff,#d9b6ff)')}
          ${UI.bar('Fame', p.fame, 'linear-gradient(90deg,#f5b224,#ffd977)')}
        </div>`;
    },

    TABS: [
      { id: 'home', icon: '🏠', label: 'Career' },
      { id: 'club', icon: '🏟️', label: 'Club' },
      { id: 'player', icon: '👤', label: 'Player' },
      { id: 'life', icon: '💞', label: 'Life' },
      { id: 'money', icon: '💰', label: 'Money' },
      { id: 'legacy', icon: '🏆', label: 'Legacy' }
    ],

    renderTabs() {
      $('tabbar').innerHTML = UI.TABS.map(t =>
        `<button class="${UI.tab === t.id ? 'on' : ''}" data-tab="${t.id}"><i>${t.icon}</i>${t.label}</button>`).join('');
      $('tabbar').querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { UI.tab = b.dataset.tab; UI.render(); });
    },

    render() {
      if (!State.game) return;
      UI.renderHUD();
      UI.renderTabs();
      const c = $('content');
      c.innerHTML = UI['tab_' + UI.tab] ? UI['tab_' + UI.tab]() : '';
      c.scrollTop = 0;
      UI.bindActions(c);
    },

    bindActions(root) {
      root.querySelectorAll('[data-act]').forEach(el => {
        el.onclick = () => global.Game.action(el.dataset.act, el.dataset.arg);
      });
    },

    /* ---------------- HOME ---------------- */
    tab_home() {
      const g = State.game, p = g.player;
      const f = Engine.Season.nextPlayable(g);
      let html = '';

      if (!f) {
        html += `<div class="card center"><h3>Season complete</h3>
          <p class="muted">All fixtures played. Time to review the season.</p>
          <button class="btn btn-primary btn-block" data-act="endSeason">End of Season Review</button></div>`;
      } else {
        Engine.Season.prepareFixture(g, f);
        const opp = f.oppId ? State.club(f.oppId) : { name: f.oppName || 'TBC', flag: '' };
        const me = State.club(p.club);
        html += `<div class="fixture">
          <div class="comp">${esc(f.label)}</div>
          <div class="teams">
            <div class="team">${f.home ? esc(me.name) : esc(opp.name)}</div>
            <div class="vs">V</div>
            <div class="team">${f.home ? esc(opp.name) : esc(me.name)}</div>
          </div>
          <div class="venue">${f.home ? '🏠 Home' : '✈️ Away'} · Match ${g.fixtureIndex + 1} of ${g.fixtures.length}</div>
        </div>`;

        const blocked = p.suspension > 0 ? `You are suspended for ${p.suspension} more match(es).`
          : p.injuries.length ? `Injured: ${p.injuries[0].name} (${p.injuries[0].matches} match(es) left).` : null;
        if (blocked) html += `<div class="card tight" style="border-color:var(--red)"><b class="bad">⚠️ ${esc(blocked)}</b>
          <div class="dim">You will not feature, but the match still has to be played.</div></div>`;

        html += `<div class="row" style="margin-bottom:12px">
          <button class="btn btn-primary grow" data-act="playMatch">▶ Play Match</button>
          <button class="btn btn-ghost" data-act="quickMatch">⏩ Quick Sim</button>
        </div>`;

        if (g.weekActionsLeft > 0) {
          html += `<div class="card" style="border-color:var(--gold)">
            <h3 style="color:var(--gold)">This week — 1 action left</h3>
            <p class="dim" style="margin:0 0 10px">Train, rest, or live your life. Choose one before kick-off.</p>
            <button class="btn btn-gold btn-block" data-act="openWeek">Choose Activity</button></div>`;
        }
      }

      // season snapshot
      const club = State.club(p.club);
      const table = Engine.Season.standings(g, club.league);
      const anyPlayed = table.some(r => r.p > 0);
      const pos = Engine.Season.position(g);
      html += `<div class="card"><h3>Season ${g.world.year}/${(g.world.year + 1) % 100}</h3>
        <div class="stat-grid">
          <div class="stat"><b>${anyPlayed ? U.ordinal(pos) : '—'}</b><span>${esc(State.league(club.league).name.split(' ')[0])}</span></div>
          <div class="stat"><b>${p.season.apps}</b><span>Apps</span></div>
          <div class="stat"><b>${p.season.goals}</b><span>Goals</span></div>
          <div class="stat"><b>${p.season.assists}</b><span>Assists</span></div>
          <div class="stat"><b>${State.seasonRating(p) || '—'}</b><span>Avg Rating</span></div>
        </div></div>`;

      // competitions
      const comps = [];
      if (g.cup) comps.push(`${g.cup.won ? '🏆' : g.cup.alive ? '🟢' : '🔴'} ${esc(g.cup.name)}`);
      if (g.cont) comps.push(`${g.cont.won ? '🏆' : g.cont.alive ? '🟢' : '🔴'} ${esc(g.cont.name)}${g.cont.stage === 'group' ? ' (' + g.cont.groupPts + ' pts)' : ''}`);
      if (comps.length) html += `<div class="card tight"><h3>Competitions</h3>${comps.map(c => `<div>${c}</div>`).join('')}</div>`;

      // news
      if (g.log.length) {
        html += `<div class="section-title">Latest</div><div class="card news">` +
          g.log.slice(0, 8).map(l => `<div class="n ${l.k}">${esc(l.t)}</div>`).join('') + `</div>`;
      }
      return html;
    },

    /* ---------------- CLUB ---------------- */
    tab_club() {
      const g = State.game, p = g.player, club = State.club(p.club);
      const league = State.league(club.league);
      const table = Engine.Season.standings(g, club.league);
      const squad = Engine.Squad.ensure(g);
      const rival = Engine.Squad.rivalFor(g);
      const startChance = Engine.Match.startingChance(g);

      let html = `<div class="card">
        <h3>${esc(club.name)}</h3>
        <div class="stat-grid">
          <div class="stat"><b>${club.rating}</b><span>Squad</span></div>
          <div class="stat"><b>${'★'.repeat(club.prestige)}</b><span>Prestige</span></div>
          <div class="stat"><b>${Math.round(p.managerTrust)}</b><span>Trust</span></div>
          <div class="stat"><b>${Math.round(startChance * 100)}%</b><span>Start XI</span></div>
        </div>
        <div class="dim" style="margin-top:10px">Contract: ${U.cash(p.contract.wage)}/week · ${p.contract.years} year(s) left
          · Release clause ${U.cash(p.contract.release)}</div>
        ${rival ? `<div class="dim">Main competition for your shirt: <b>${esc(rival.name)}</b> (${rival.ovr} OVR)</div>` : ''}
      </div>`;

      html += `<div class="card"><h3>${esc(league.name)}</h3><div class="scroll-x"><table class="tbl">
        <tr><th>#</th><th>Club</th><th class="num">P</th><th class="num">W</th><th class="num">D</th>
        <th class="num">L</th><th class="num">GD</th><th class="num">Pts</th></tr>` +
        table.map((r, i) => {
          const cls = i === 0 ? 'ucl' : i < 4 ? 'ucl' : i >= table.length - 2 ? 'rel' : '';
          return `<tr class="${r.id === club.id ? 'me' : ''}">
            <td><span class="pos-chip ${cls}">${i + 1}</span></td><td>${esc(r.club.name)}</td>
            <td class="num">${r.p}</td><td class="num">${r.w}</td><td class="num">${r.d}</td>
            <td class="num">${r.l}</td><td class="num">${r.gf - r.ga > 0 ? '+' : ''}${r.gf - r.ga}</td>
            <td class="num"><b>${r.pts}</b></td></tr>`;
        }).join('') + `</table></div></div>`;

      const scorers = Engine.Awards.leagueTopScorers(g).slice(0, 6);
      html += `<div class="card"><h3>Top scorers</h3><table class="tbl">` +
        scorers.map((s, i) => `<tr class="${s.you ? 'me' : ''}"><td>${i + 1}</td><td>${esc(s.name)}</td>
          <td class="dim">${esc(s.club)}</td><td class="num"><b>${s.goals}</b></td></tr>`).join('') + `</table></div>`;

      html += `<div class="card"><h3>Squad</h3><div class="list">` +
        squad.slice(0, 14).map(s => `<div class="item">
          <div class="ic">${s.pos === p.pos ? '🔁' : '👤'}</div>
          <div class="tx"><b>${esc(s.name)} ${s.captain ? '(C)' : ''}</b>
          <span>${s.pos} · ${s.age}y · ${s.goals} goals this season · relationship ${Math.round(s.rel)}%</span></div>
          <div class="pill ${s.ovr > p.ovr ? 'red' : 'green'}">${s.ovr}</div></div>`).join('') + `</div></div>`;
      return html;
    },

    /* ---------------- PLAYER ---------------- */
    tab_player() {
      const g = State.game, p = g.player;
      let html = `<div class="card">
        <h3>Attributes</h3>
        ${D.ATTR_KEYS.filter(k => k !== 'gk' || p.pos === 'GK').map(k => UI.attrRow(p, k)).join('')}
        <div class="dim">The white marker is your realistic ceiling in this attribute. Potential: ${p.potential}</div>
      </div>`;

      html += `<div class="card"><h3>This season</h3><div class="stat-grid">
        <div class="stat"><b>${p.season.apps}</b><span>Apps</span></div>
        <div class="stat"><b>${p.season.goals}</b><span>Goals</span></div>
        <div class="stat"><b>${p.season.assists}</b><span>Assists</span></div>
        <div class="stat"><b>${p.season.motm}</b><span>MOTM</span></div>
        <div class="stat"><b>${State.seasonRating(p) || '—'}</b><span>Rating</span></div>
        <div class="stat"><b>${p.season.yellow}/${p.season.red}</b><span>Cards</span></div>
      </div></div>`;

      html += `<div class="card"><h3>Career totals</h3><div class="stat-grid">
        <div class="stat"><b>${p.career.apps}</b><span>Apps</span></div>
        <div class="stat"><b>${p.career.goals}</b><span>Goals</span></div>
        <div class="stat"><b>${p.career.assists}</b><span>Assists</span></div>
        <div class="stat"><b>${State.careerRating(p) || '—'}</b><span>Rating</span></div>
        <div class="stat"><b>${p.intl.caps}</b><span>Caps</span></div>
        <div class="stat"><b>${p.intl.goals}</b><span>Intl Goals</span></div>
      </div></div>`;

      html += `<div class="card"><h3>Traits</h3>`;
      if (p.traits.length) {
        html += p.traits.map(t => { const tr = D.TRAITS[t];
          return `<div class="trait ${tr.bad ? 'bad' : ''}"><div class="ic">${tr.icon}</div>
            <div><b>${esc(tr.name)}</b><span>${esc(tr.desc)}</span></div></div>`; }).join('');
      } else html += `<p class="dim" style="margin:0">No traits yet. Perform in big moments and they will come.</p>`;
      html += `</div>`;

      if (p.injuries.length) {
        html += `<div class="card" style="border-color:var(--red)"><h3 class="bad">Injuries</h3>` +
          p.injuries.map(i => `<div class="item"><div class="ic">🩹</div><div class="tx"><b>${esc(i.name)}</b>
            <span>${i.matches} match(es) remaining</span></div></div>`).join('') + `</div>`;
      }

      html += `<div class="card"><h3>Condition</h3>
        ${UI.bar('Health', p.health, '#22e07a')}${UI.bar('Happiness', p.happiness, '#b483ff')}
        ${UI.bar('Discipline', p.discipline, '#5aa8ff')}
        <div class="dim" style="margin-top:8px">Market value <b>${U.cash(State.marketValue(p))}</b> ·
          Followers <b>${U.money(p.followers)}</b></div></div>`;

      if (p.age >= D.CONFIG.RETIRE_MIN_AGE) {
        html += `<button class="btn btn-danger btn-block" data-act="retire">Retire from football</button>`;
      }
      return html;
    },

          ${UI.bar('Relationship', partner.level, 'linear-gradient(90deg,#ff6b9d,#ffa8c5)')}

            <button class="btn btn-ghost" data-act="rel" data-arg="gift">🎁 Buy a gift</button>

        <div class="stat"><b>${U.money(p.followers)}</b><span>Followers</span></div>
        <div class="stat"><b>${Math.round(p.happiness)}</b><span>Happiness</span></div>
        <div class="stat"><b>${p.languages || 1}</b><span>Languages</span></div>
      </div></div>`;

      html += `<div class="card"><h3>Do something</h3><div class="list">
        <div class="item click" data-act="socialMenu"><div class="ic">📱</div><div class="tx"><b>Post on social media</b><span>Grow the brand — or start a fire</span></div></div>
        <div class="item click" data-act="mediaMenu"><div class="ic">🎙️</div><div class="tx"><b>Give an interview</b><span>Humble, bold, or burn it all down</span></div></div>
        <div class="item click" data-act="doActivity" data-arg="charity"><div class="ic">❤️</div><div class="tx"><b>Charity work</b><span>Costs money. Worth it.</span></div></div>

      if (p.achievements.length) {
