# Publishes the game to GitHub Pages.
#
# Every push to the default branch redeploys https://<owner>.github.io/<repo>/,
# and the Actions tab has a Run workflow button for a manual redeploy.
#
# This needs Settings -> Pages -> Build and deployment -> Source set to
# "GitHub Actions". On "Deploy from a branch" the github-pages environment
# refuses deployments from here and the job dies in a couple of seconds with
# no step logs at all, which is a confusing way to find out.
name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/football-simulator-game-autd54]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild the single-file version so it cannot drift
        run: |
          node build.js
          git diff --exit-code play.html dist/artifact.html \
            || echo "::warning::play.html was stale in git; deploying a freshly built copy"

      - name: Enable and configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
