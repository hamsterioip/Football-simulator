<title>Football Life</title>
<style>
/* css/styles.css */
/* ==========================================================================
   Football Life — stylesheet
   ========================================================================== */
:root{
  --bg:#080d16;
  --bg2:#0d1524;
  --card:#121c2e;
  --card2:#17223a;
  --line:#22304c;
  --txt:#e8eefc;
  --muted:#8fa2c4;
  --dim:#64769a;
  --green:#22e07a;
  --green-d:#12b45f;
  --pitch:#0e7a45;
  --gold:#ffc94d;
  --red:#ff5a6a;
  --blue:#5aa8ff;
  --purple:#b483ff;
  --radius:16px;
  --radius-s:10px;
  --shadow:0 10px 30px rgba(0,0,0,.45);
  --safe-b: env(safe-area-inset-bottom, 0px);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;background:
    radial-gradient(1200px 700px at 50% -12%, #14305a 0%, transparent 60%),
    radial-gradient(900px 500px at 100% 100%, #0d3a28 0%, transparent 55%),
    var(--bg);
  color:var(--txt);
  font:15px/1.5 "Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  overflow:hidden;
}
button,input,select,textarea{font:inherit;color:inherit}
button,.choice,.item.click,.opt,.club,.tabbar button{touch-action:manipulation;user-select:none;-webkit-user-select:none}

/* ---------- screens ---------- */
.screen{position:fixed;inset:0;height:100vh;height:100dvh;display:none;flex-direction:column;overflow:hidden}
.screen.active{display:flex}

/* ---------- generic ---------- */
.btn{
  border:1px solid var(--line);background:var(--card2);color:var(--txt);
  border-radius:var(--radius-s);padding:11px 16px;cursor:pointer;font-weight:600;
  transition:transform .08s ease, filter .15s ease, background .15s ease;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
}
.btn:hover{filter:brightness(1.15)}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn-primary{background:linear-gradient(180deg,var(--green),var(--green-d));border-color:transparent;color:#03260f}
.btn-gold{background:linear-gradient(180deg,#ffd977,#f5b224);border-color:transparent;color:#2b1c00}
.btn-danger{background:linear-gradient(180deg,#ff7a86,#e03a4c);border-color:transparent;color:#2b0006}
.btn-ghost{background:rgba(255,255,255,.04)}
.btn-lg{padding:15px 26px;font-size:16px}
.btn-block{display:flex;width:100%}
.row{display:flex;gap:10px}
.row.wrap{flex-wrap:wrap}
.grow{flex:1}
.center{text-align:center}
.muted{color:var(--muted)}
.dim{color:var(--dim);font-size:13px}
.good{color:var(--green)}
.bad{color:var(--red)}
.gold{color:var(--gold)}
.hidden{display:none !important}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:15px;letter-spacing:.4px;text-transform:uppercase;color:var(--muted)}
.card.tight{padding:12px}

.pill{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.07);
  border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600}
.pill.green{background:rgba(34,224,122,.16);color:var(--green)}
.pill.red{background:rgba(255,90,106,.16);color:var(--red)}
.pill.gold{background:rgba(255,201,77,.16);color:var(--gold)}
.pill.blue{background:rgba(90,168,255,.16);color:var(--blue)}

/* ---------- start screen ---------- */
.start-wrap{margin:auto;text-align:center;padding:24px;max-width:520px}
.start-badge{width:86px;height:86px;margin:0 auto;color:var(--green);
  filter:drop-shadow(0 8px 24px rgba(34,224,122,.35));animation:bob 3s ease-in-out infinite}
.start-badge svg{width:100%;height:100%;fill:currentColor}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.start-title{font-size:44px;margin:6px 0 4px;letter-spacing:2px;font-weight:900}
.start-title span{color:var(--green)}
.start-sub{color:var(--muted);margin:0 0 26px}
.start-actions{display:flex;flex-direction:column;gap:10px;max-width:300px;margin:0 auto}
.start-feats{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:28px}
.start-feats span{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);
  background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:999px;padding:5px 11px}
.start-feats .ic{color:var(--green)}

/* ---------- create ---------- */
.create-wrap{margin:0 auto;width:100%;max-width:720px;padding:22px 20px 24px;
  max-height:100%;overflow-y:auto;overscroll-behavior:contain}
.steps{display:flex;gap:6px;margin-bottom:18px}
.steps div{flex:1;height:4px;border-radius:4px;background:var(--line)}
.steps div.on{background:var(--green)}
.create-nav{display:flex;gap:10px;justify-content:space-between;margin-top:18px;padding-bottom:20px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:6px}
.input,select.input{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius-s);padding:12px 14px}
.input:focus{outline:2px solid var(--green);outline-offset:0}
.opt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.opt{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-s);padding:12px 8px;
  text-align:center;cursor:pointer;transition:.12s;font-weight:600;font-size:13px}
.opt:hover{border-color:var(--green)}
.opt.sel{background:rgba(34,224,122,.14);border-color:var(--green);color:var(--green)}
.opt small{display:block;color:var(--dim);font-weight:500;font-size:11px;margin-top:2px}
.opt.sel small{color:rgba(34,224,122,.75)}

.club-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;max-height:46vh;overflow-y:auto;padding-right:4px}
.club{display:flex;flex-direction:column;gap:2px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--radius-s);padding:10px 12px;cursor:pointer;text-align:left}
.club:hover{border-color:var(--green)}
.club.sel{background:rgba(34,224,122,.13);border-color:var(--green)}
.club.locked{opacity:.35;cursor:not-allowed}
.club b{font-size:13px}
.club span{font-size:11px;color:var(--dim)}

/* ---------- HUD ---------- */
.hud{background:linear-gradient(180deg,rgba(13,21,36,.98),rgba(13,21,36,.86));
  border-bottom:1px solid var(--line);padding:10px 14px;backdrop-filter:blur(12px);flex:0 0 auto}
.hud-top{display:flex;align-items:center;gap:10px}
.hud-avatar{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#1d3a63,#0f6b42);
  display:grid;place-items:center;font-weight:800;font-size:15px;flex:0 0 auto}
.hud-name{font-weight:800;font-size:16px;line-height:1.15}
.hud-meta{font-size:12px;color:var(--muted)}
.hud-ovr{margin-left:auto;text-align:center;background:rgba(255,255,255,.06);border-radius:12px;padding:4px 11px}
.hud-ovr b{display:block;font-size:20px;line-height:1;color:var(--green)}
.hud-ovr span{font-size:9px;letter-spacing:1px;color:var(--muted)}
.hud-bars{display:flex;gap:8px;margin-top:9px}
.bar{flex:1}
.bar-l{display:flex;justify-content:space-between;font-size:10px;color:var(--dim);margin-bottom:3px;text-transform:uppercase;letter-spacing:.5px}
.bar-t{height:5px;background:rgba(255,255,255,.08);border-radius:4px;overflow:hidden}
.bar-f{height:100%;border-radius:4px;transition:width .4s ease}

/* ---------- content + tabs ---------- */
.content{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:14px 14px 90px;-webkit-overflow-scrolling:touch}
.tabbar{position:fixed;bottom:0;left:0;right:0;display:flex;background:rgba(9,14,24,.96);
  border-top:1px solid var(--line);backdrop-filter:blur(12px);padding-bottom:var(--safe-b);z-index:20}
.tabbar button{flex:1;background:none;border:none;padding:9px 2px 11px;color:var(--dim);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:600}
.tabbar button.on{color:var(--green)}
.tabbar button i{font-style:normal;font-size:19px}

/* ---------- home ---------- */
.fixture{background:linear-gradient(135deg,#132a45,#0f2e2a);border:1px solid var(--line);
  border-radius:var(--radius);padding:16px;margin-bottom:12px;position:relative;overflow:hidden}
.fixture:before{content:"";position:absolute;inset:0;background:
  repeating-linear-gradient(90deg,rgba(255,255,255,.03) 0 22px,transparent 22px 44px);pointer-events:none}
.fixture .comp{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--green);font-weight:700}
.fixture .teams{display:flex;align-items:center;justify-content:space-between;margin:12px 0;gap:8px}
.fixture .team{flex:1;text-align:center;font-weight:800;font-size:15px}
.fixture .vs{font-size:12px;color:var(--muted);font-weight:700}
.fixture .venue{font-size:12px;color:var(--muted);text-align:center}

.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;gap:11px;align-items:center;background:var(--card);border:1px solid var(--line);
  border-radius:var(--radius-s);padding:11px 13px}
.item .ic{font-size:20px;flex:0 0 auto}
.item .tx{flex:1;min-width:0}
.item .tx b{display:block;font-size:14px}
.item .tx span{font-size:12px;color:var(--muted);display:block}
.item.click{cursor:pointer;transition:.12s}
.item.click:hover{border-color:var(--green);transform:translateX(2px)}

.news .n{border-left:3px solid var(--line);padding:6px 0 6px 11px;margin-bottom:8px;font-size:13px}
.news .n.good{border-color:var(--green)}
.news .n.bad{border-color:var(--red)}

/* ---------- tables ---------- */
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
table.tbl th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--dim);
  padding:6px 4px;border-bottom:1px solid var(--line);font-weight:700}
table.tbl td{padding:7px 4px;border-bottom:1px solid rgba(255,255,255,.05)}
table.tbl tr.me td{background:rgba(34,224,122,.1);font-weight:700}
table.tbl td.num,table.tbl th.num{text-align:center;width:30px}
.pos-chip{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:6px;
  background:rgba(255,255,255,.07);font-size:11px;font-weight:700;margin-right:6px}
.pos-chip.ucl{background:rgba(90,168,255,.25);color:var(--blue)}
.pos-chip.rel{background:rgba(255,90,106,.25);color:var(--red)}

/* ---------- attributes ---------- */
.attr{margin-bottom:9px}
.attr-h{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.attr-h b{font-variant-numeric:tabular-nums}
.attr-t{height:7px;background:rgba(255,255,255,.08);border-radius:5px;overflow:hidden;position:relative}
.attr-f{height:100%;border-radius:5px;background:linear-gradient(90deg,var(--green-d),var(--green))}
.attr-cap{position:absolute;top:-2px;bottom:-2px;width:2px;background:rgba(255,255,255,.5)}

.trait{display:flex;gap:9px;align-items:center;background:var(--card2);border:1px solid var(--line);
  border-radius:var(--radius-s);padding:9px 11px;margin-bottom:7px}
.trait.bad{border-color:rgba(255,90,106,.5)}
.trait .ic{font-size:19px}
.trait b{font-size:13px;display:block}
.trait span{font-size:11px;color:var(--muted)}

.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:8px}
.stat{background:var(--card2);border:1px solid var(--line);border-radius:var(--radius-s);padding:10px;text-align:center}
.stat b{display:block;font-size:21px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}

/* ---------- match ---------- */
.match-shell{display:flex;flex-direction:column;height:100%;max-width:640px;margin:0 auto;width:100%}
.scoreboard{background:linear-gradient(180deg,#0f2c22,#0b1a2e);border-bottom:1px solid var(--line);
  padding:14px 16px 12px;flex:0 0 auto}
.sb-comp{text-align:center;font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--green);font-weight:700}
.sb-main{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:8px}
.sb-team{flex:1;text-align:center;font-weight:800;font-size:14px;min-width:0}
.sb-score{font-size:34px;font-weight:900;letter-spacing:1px;font-variant-numeric:tabular-nums}
.sb-min{text-align:center;font-size:12px;color:var(--muted);margin-top:5px}
.sb-you{display:flex;gap:6px;justify-content:center;margin-top:9px;flex-wrap:wrap}

.match-feed{flex:1;min-height:64px;overflow-y:auto;overscroll-behavior:contain;padding:14px}
.ev{display:flex;gap:10px;margin-bottom:11px;animation:slidein .25s ease}
@keyframes slidein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.ev .m{flex:0 0 34px;font-size:11px;color:var(--dim);font-weight:700;padding-top:2px;font-variant-numeric:tabular-nums}
.ev .t{flex:1;font-size:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 12px}
.ev.good .t{border-color:rgba(34,224,122,.5);background:rgba(34,224,122,.09)}
.ev.bad .t{border-color:rgba(255,90,106,.45);background:rgba(255,90,106,.08)}
.ev.you .t{border-color:rgba(255,201,77,.5);background:rgba(255,201,77,.08)}

.match-action{flex:0 0 auto;border-top:1px solid var(--line);background:rgba(9,14,24,.97);
  padding:12px 14px calc(14px + var(--safe-b));backdrop-filter:blur(12px);
  max-height:62vh;max-height:62dvh;overflow-y:auto;overscroll-behavior:contain}
.scn{animation:pop .25s ease}
@keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.scn-h{display:flex;gap:10px;align-items:center;margin-bottom:4px}
.scn-h .art{font-size:28px}
.scn-h b{font-size:17px}
.scn-sub{font-size:13px;color:var(--muted);margin-bottom:11px}
.choices{display:flex;flex-direction:column;gap:7px}
/* five or six options (penalty placement, celebrations) go two-up: the whole
   set stays visible instead of the last ones hiding below the fold */
.choices.cols{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.choices.cols .choice{flex-direction:column;align-items:stretch;gap:2px}
.choices.cols .tag{align-self:flex-start;margin-top:2px}
.choices.cols .choice span{font-size:11px;line-height:1.3}
.choice{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:11px 13px;cursor:pointer;transition:.12s;display:flex;align-items:center;gap:10px}
.choice:hover{border-color:var(--green);background:var(--card2);transform:translateX(3px)}
.choice .cb{flex:1;min-width:0}
.choice b{display:block;font-size:14px}
.choice span{font-size:11.5px;color:var(--muted)}
.choice .tag{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--green);
  background:rgba(34,224,122,.12);border-radius:6px;padding:3px 7px;font-weight:700;flex:0 0 auto}

/* ---------- modal ---------- */
.modal-back{position:fixed;inset:0;background:rgba(4,8,14,.78);backdrop-filter:blur(6px);
  display:none;align-items:center;justify-content:center;z-index:100;
  padding:18px 18px calc(18px + var(--safe-b))}
.modal-back.on{display:flex}
.modal{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  width:100%;max-width:520px;max-height:88vh;max-height:88dvh;overflow-y:auto;overscroll-behavior:contain;
  padding:20px;box-shadow:var(--shadow);
  animation:pop .2s ease}
.modal h2{margin:0 0 6px;font-size:20px}
.modal p{margin:0 0 14px;color:var(--muted);white-space:pre-line}
.modal .modal-actions{display:flex;flex-direction:column;gap:8px;margin-top:6px}

/* ---------- toasts ---------- */
.toasts{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:200;
  display:flex;flex-direction:column;gap:7px;pointer-events:none;width:calc(100% - 28px);max-width:420px}
.toast{background:rgba(18,28,46,.97);border:1px solid var(--line);border-radius:12px;padding:10px 14px;
  font-size:13px;font-weight:600;box-shadow:var(--shadow);animation:toastin .3s ease}
.toast.good{border-color:var(--green);color:var(--green)}
.toast.bad{border-color:var(--red);color:var(--red)}
.toast.gold{border-color:var(--gold);color:var(--gold)}
@keyframes toastin{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}

/* ---------- misc ---------- */
.section-title{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--dim);
  margin:16px 0 8px;font-weight:700}
.season-row{display:flex;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:13px}
.season-row .yr{font-weight:800;flex:0 0 46px;font-variant-numeric:tabular-nums}
.trophy{display:inline-flex;align-items:center;gap:5px;background:rgba(255,201,77,.13);color:var(--gold);
  border-radius:8px;padding:4px 9px;font-size:12px;font-weight:700;margin:0 5px 5px 0}
.big-num{font-size:40px;font-weight:900;line-height:1}
progress{width:100%}
.divider{height:1px;background:var(--line);margin:14px 0}
.scroll-x{overflow-x:auto}
/* short screens (most phones in portrait): tighten the match UI so even a
   six-option penalty fits on one screen without scrolling */
@media (max-height:720px){
  .scoreboard{padding:10px 14px 9px}
  .sb-score{font-size:27px}
  .sb-main{margin-top:6px;gap:10px}
  .sb-you{margin-top:6px;gap:5px}
  .sb-min{margin-top:3px;font-size:11px}
  .match-action{padding:9px 12px calc(10px + var(--safe-b))}
  .scn-h{margin-bottom:2px}
  .scn-h .art{font-size:22px}
  .scn-h b{font-size:15px}
  .scn-sub{font-size:12px;margin-bottom:8px;line-height:1.35}
  .choices{gap:5px}
  .choice{padding:8px 11px}
  .choice b{font-size:13px}
  .choice span{font-size:10.5px}
  .ev .t{padding:7px 11px;font-size:13px}
}

/* ---------- icons ---------- */
.ic{width:1.15em;height:1.15em;fill:currentColor;flex:0 0 auto;vertical-align:-.18em}
.fl{width:1.25em;height:1.25em;border-radius:50%;flex:0 0 auto;vertical-align:-.22em}
.fl.sm{width:1em;height:1em}
.fl.lg{width:44px;height:44px}
.btn .ic{width:1.05em;height:1.05em}
.item .ic{width:22px;height:22px;color:var(--green)}
.item.tight-item{padding:8px 11px}
.tabbar button .ic{width:21px;height:21px}
.tabbar button{position:relative}
.tab-badge{position:absolute;top:4px;right:50%;margin-right:-26px;min-width:17px;height:17px;
  padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:9.5px;font-weight:800;
  line-height:17px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.5)}
.trait .ic{width:20px;height:20px;color:var(--green)}
.trait.bad .ic{color:var(--red)}
.scn-h .art{width:30px;height:30px;color:var(--green)}
.scn-h .art .ic{width:30px;height:30px}
.pill .ic{width:1em;height:1em}
.pill.yellow{background:rgba(255,201,77,.2);color:var(--gold)}
.comp-row{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:14px}
.kv{display:flex;align-items:flex-start;gap:8px;font-size:12.5px;color:var(--muted);margin-top:8px}
.kv .ic{color:var(--green);margin-top:1px}
.card.warn{border-color:var(--red)}
.card.gold-edge{border-color:var(--gold)}
.hud-id{min-width:0}
.hud-avatar .shirt-no{font-size:17px;font-weight:900;font-variant-numeric:tabular-nums}
.hud-meta{display:flex;align-items:center;gap:5px}

/* ---------- club crests ---------- */
.crest{width:1.6em;height:1.6em;flex:0 0 auto;vertical-align:-.35em;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.45))}
.crest-badge{position:relative;display:inline-block}
.crest-badge svg{width:100%;height:100%;display:block}
.crest-badge img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.crest-sm{width:20px;height:20px}
.crest-md{width:30px;height:30px}
.crest-lg{width:46px;height:46px}
.crest-xl{width:62px;height:62px}
table.tbl .crest-sm{width:17px;height:17px;vertical-align:-.28em;margin-right:6px}
.fixture .team .crest{display:block;margin:0 auto 6px}
.sb-team .crest{display:block;margin:0 auto 4px}
.hud-club{display:flex;align-items:center;gap:5px}
.club-line{display:flex;align-items:center;gap:9px}

/* ---------- squad list ---------- */
.sq-no{width:26px;height:26px;flex:0 0 auto;border-radius:8px;display:grid;place-items:center;
  background:rgba(255,255,255,.07);font-size:12px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--muted)}
.you-row{border-color:var(--green);background:rgba(34,224,122,.08)}
.you-row .sq-no{background:rgba(34,224,122,.2);color:var(--green)}
.danger-man{border-color:rgba(255,90,106,.4)}
.danger-man .ic{color:var(--red)}

/* ---------- form guide ---------- */
.form-guide{display:flex;gap:4px;margin-top:7px}
.fg{width:19px;height:19px;border-radius:6px;display:grid;place-items:center;
  font-size:10px;font-weight:800;background:rgba(255,255,255,.09);color:var(--muted)}
.fg.w{background:rgba(34,224,122,.22);color:var(--green)}
.fg.d{background:rgba(255,255,255,.12);color:var(--muted)}
.fg.l{background:rgba(255,90,106,.2);color:var(--red)}
.fixture .form-guide{justify-content:center;margin-top:10px}
.fixture{border-top:3px solid var(--home)}
.fixture .teams{align-items:flex-start}
.fixture .team{font-size:13.5px;line-height:1.25}

/* ---------- creation wizard ---------- */
.wz-h{margin:0 0 4px;font-size:22px;letter-spacing:-.3px}
.wz-p{color:var(--muted);margin:0 0 18px;font-size:14px}
.opt-grid.two{grid-template-columns:1fr 1fr}
.preview-card{background:linear-gradient(135deg,#132a45,#0f2e2a)}
.prev-ovr{text-align:center;background:rgba(255,255,255,.06);border-radius:10px;padding:5px 11px;flex:0 0 auto}
.prev-ovr b{display:block;font-size:19px;line-height:1;color:var(--green)}
.prev-ovr.pot b{color:var(--gold)}
.prev-ovr span{font-size:8px;letter-spacing:1px;color:var(--muted)}

/* ---------- the draft ---------- */
.legend-card{background:linear-gradient(160deg,#152a44,#101c2f);border:1px solid var(--line);
  border-radius:var(--radius);padding:16px;margin-bottom:12px}
.legend-top{display:flex;align-items:center;gap:12px}
.legend-id{flex:1;min-width:0}
.legend-id b{display:block;font-size:18px;letter-spacing:-.2px}
.legend-id span{font-size:12px;color:var(--muted)}
.legend-count{font-size:20px;font-weight:900;color:var(--green);font-variant-numeric:tabular-nums}
.legend-count span{font-size:12px;color:var(--dim);font-weight:700}
.legend-note{font-style:italic;color:var(--muted);font-size:13px;margin:12px 0 14px;line-height:1.45}
.steal-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.steal{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;
  background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:9px 4px;
  cursor:pointer;transition:.12s;color:var(--txt)}
.steal .ic{width:17px;height:17px;color:var(--muted)}
.steal b{font-size:17px;line-height:1.1;font-variant-numeric:tabular-nums}
.steal span{font-size:8.5px;text-transform:uppercase;letter-spacing:.3px;color:var(--dim);text-align:center;line-height:1.2}
.steal:hover:not(:disabled){border-color:var(--green);transform:translateY(-2px)}
.steal.elite b{color:var(--gold)}
.steal.elite{border-color:rgba(255,201,77,.45)}
.steal.good b{color:var(--green)}
.steal.ok b{color:var(--txt)}
.steal.poor b{color:var(--dim)}
.steal.taken{opacity:.28;cursor:not-allowed}
.steal em{position:absolute;inset:auto 0 3px;font-size:7.5px;letter-spacing:.5px;
  text-transform:uppercase;color:var(--red);font-style:normal}
.robbed{margin-top:4px}
.rob-chip{display:inline-flex;align-items:center;gap:4px;background:rgba(34,224,122,.12);
  color:var(--green);border-radius:8px;padding:4px 8px;font-size:11px;font-weight:600;margin:4px 4px 0 0}
.rob-chip .ic{width:13px;height:13px}

/* ---------- off-field moments ---------- */
.ev-card{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:12px}
.ev-top{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.ev-icon{width:24px;height:24px;color:var(--green)}
.ev-cat{font-size:9.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--dim);font-weight:800}
.ev-text{margin:0;font-size:14px;line-height:1.5;color:var(--txt);white-space:normal}
.ev-outcome{font-size:14.5px;line-height:1.55;white-space:pre-line}
.ev-outcome.good{color:var(--green)}
.ev-outcome.bad{color:var(--red)}
.modal .choices{margin-top:2px}

/* ---------- boss mode ---------- */
.secret-head{border-color:var(--gold);background:linear-gradient(135deg,rgba(255,201,77,.08),transparent)}
.btn.sm{padding:7px 10px;font-size:12.5px;border-radius:9px}
.dev-attr{padding:9px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.dev-attr:last-child{border-bottom:none}
.dev-attr-h{display:flex;align-items:center;gap:7px;font-size:13px;margin-bottom:7px}
.dev-attr-h em{font-style:normal;font-weight:800;font-variant-numeric:tabular-nums}
.dev-attr-h .ic{color:var(--green)}
.dev-traits{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.dev-trait{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;
  background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:9px 10px;
  cursor:pointer;color:var(--txt);transition:.12s}
.dev-trait .ic{color:var(--dim);width:18px;height:18px}
.dev-trait b{font-size:12.5px;line-height:1.2}
.dev-trait span{font-size:10px;color:var(--dim);line-height:1.3}
.dev-trait.on{background:rgba(34,224,122,.13);border-color:var(--green)}
.dev-trait.on .ic{color:var(--green)}
.dev-trait.on.bad{background:rgba(255,90,106,.13);border-color:var(--red)}
.dev-trait.on.bad .ic{color:var(--red)}
#dev-clubs{max-height:38vh}

/* ---------- press ---------- */
.headline{border-left:3px solid var(--line);padding:8px 0 8px 12px;margin-bottom:10px;
  display:flex;align-items:flex-start;gap:10px}
.headline.good{border-color:var(--green)}
.headline.bad{border-color:var(--red)}
.hl-ic{width:22px;height:22px;flex:0 0 auto;margin-top:1px;opacity:.85}
.hl-ic .ic{width:22px;height:22px}
.hl-body{min-width:0}
.hl-src{font-size:9.5px;text-transform:uppercase;letter-spacing:1px;color:var(--dim);font-weight:700}
.hl-t{font-size:14.5px;font-weight:700;line-height:1.35;margin-top:2px}
.rank-title{font-weight:800;letter-spacing:1px;margin-top:4px}

@media (max-height:720px){
  .steal{padding:7px 3px}
  .steal b{font-size:15px}
  .legend-note{margin:9px 0 11px;font-size:12px}
}

@media(min-width:760px){
  .content{padding:20px 20px 100px;max-width:820px;margin:0 auto;width:100%}
  .hud{max-width:820px;margin:0 auto;width:100%;border-radius:0 0 var(--radius) var(--radius)}
  .tabbar{max-width:820px;margin:0 auto;border-radius:var(--radius) var(--radius) 0 0}
}

  "Austin FC": "https://upload.wikimedia.org/wikipedia/commons/thumb/9/95/MLS_crest_logo_RGB_-_Austin_FC.svg/250px-MLS_crest_logo_RGB_-_Austin_FC.svg.png"
};
})(window);

<script>
/* js/crest.js */
/* ==========================================================================
   crest.js — every club gets its own badge, drawn rather than borrowed.

   Each club is rendered as a shield in its real colours and shirt pattern
   with its initials on it. Pure inline SVG: no images, no requests, scales
   to any size.

   When the club's real badge is known (js/badges.js, hot-linked from
   Wikipedia), it is layered on top of the shield: online you see the real
   thing, offline or on a failed request the drawn shield shows through.
   ========================================================================== */
(function (global) {
  'use strict';

  const SHIELD = 'M2 2 h28 v17 c0 7-8 11-14 13 C10 30 2 26 2 19 Z';

  // A club with no kit on file still gets a stable identity from its name.
  function fallbackKit(name) {
    let h = 0;
    for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) & 0xffff;
    const hues = [4, 28, 48, 96, 140, 172, 200, 224, 264, 300, 330];
    const hue = hues[h % hues.length];
    return ['hsl(' + hue + ',62%,45%)', 'hsl(' + ((hue + 40) % 360) + ',55%,88%)', 'plain'];
  }

  // "Manchester United" -> MU, "Ajax" -> AJA, "Inter" -> INT
  function initials(name) {
    const words = String(name).replace(/[^A-Za-zÀ-ÿ ]/g, '').split(/\s+/).filter(Boolean);
    const skip = { de: 1, do: 1, of: 1, the: 1, fc: 1, cf: 1, sc: 1, ac: 1 };
    const useful = words.filter(w => !skip[w.toLowerCase()]);
    if (useful.length >= 2) return (useful[0][0] + useful[1][0]).toUpperCase();
    const w = useful[0] || words[0] || '?';
    return w.slice(0, 3).toUpperCase();
  }

  function readable(hex) {
    const c = String(hex).replace('#', '');
    if (c.length < 6) return '#0b1220';
    const r = parseInt(c.slice(0, 2), 16), g = parseInt(c.slice(2, 4), 16), b = parseInt(c.slice(4, 6), 16);
    // relative luminance, good enough to pick black or white text
    return (0.299 * r + 0.587 * g + 0.114 * b) > 150 ? '#10192b' : '#ffffff';
  }

  function pattern(kind, a, bCol) {
    switch (kind) {
      case 'stripes':
        return `<rect width="32" height="32" fill="${a}"/>`
          + [6, 14, 22].map(x => `<rect x="${x}" y="0" width="4.5" height="32" fill="${bCol}"/>`).join('');
      case 'hoops':
        return `<rect width="32" height="32" fill="${a}"/>`
          + [5, 13, 21].map(y => `<rect x="0" y="${y}" width="32" height="4.5" fill="${bCol}"/>`).join('');
      case 'halves':
        return `<rect width="16" height="32" fill="${a}"/><rect x="16" width="16" height="32" fill="${bCol}"/>`;
      case 'quarters':
        return `<rect width="32" height="32" fill="${a}"/>`
          + `<rect x="16" width="16" height="16" fill="${bCol}"/><rect y="16" width="16" height="16" fill="${bCol}"/>`;
      case 'sash':
        return `<rect width="32" height="32" fill="${a}"/>`
          + `<path d="M-4 26 L26 -4 L34 4 L4 34 Z" fill="${bCol}"/>`;
      case 'sleeve':
        return `<rect width="32" height="32" fill="${a}"/>`
          + `<rect x="0" y="0" width="5" height="32" fill="${bCol}"/><rect x="27" y="0" width="5" height="32" fill="${bCol}"/>`;
      default:
        return `<rect width="32" height="32" fill="${a}"/>`;
    }
  }

  let seq = 0;

  const Crest = {
    kitFor(clubName) {
      const D = global.DATA;
      return (D && D.CLUB_KIT && D.CLUB_KIT[clubName]) || fallbackKit(clubName || '?');
    },

    /* Markup for one club badge. `cls` sizes it via CSS (.crest-sm/-md/-lg).
       The real badge image (when known) floats over the drawn shield; if it
       fails to load it removes itself and the shield remains. */
    svg(clubName, cls) {
      const kit = Crest.kitFor(clubName);
      const [a, b, kind] = kit;
      const uid = 'cr' + (++seq);
      const text = initials(clubName);
      // the outline behind the initials guarantees contrast on any pattern
      const ink = readable(a);
      const size = text.length > 2 ? 11 : 13;
      const label = String(clubName).replace(/[<>&"]/g, '') + ' crest';
      const shield = `<svg viewBox="0 0 32 32" role="img" aria-label="${label}">
        <defs><clipPath id="${uid}"><path d="${SHIELD}"/></clipPath></defs>
        <g clip-path="url(#${uid})">${pattern(kind, a, b)}</g>
        <path d="${SHIELD}" fill="none" stroke="rgba(0,0,0,.45)" stroke-width="1.6"/>
        <path d="${SHIELD}" fill="none" stroke="rgba(255,255,255,.28)" stroke-width=".7"/>
        <text x="16" y="19" text-anchor="middle" font-size="${size}" font-weight="800"
          font-family="Inter,Helvetica,Arial,sans-serif" fill="${ink}"
          stroke="rgba(0,0,0,.35)" stroke-width=".4" paint-order="stroke">${text}</text>
      </svg>`;
      const badge = (global.BADGES || {})[clubName];
      if (!badge) return shield.replace('<svg ', '<svg class="crest ' + (cls || '') + '" ');
      return `<span class="crest ${cls || ''} crest-badge">${shield}` +
        `<img src="${badge}" alt="" loading="lazy" onerror="this.remove()"/></span>`;
    },

    // the colour to tint a panel with for this club
    accent(clubName) { return Crest.kitFor(clubName)[0]; },
    accent2(clubName) { return Crest.kitFor(clubName)[1]; }
  };

  global.Crest = Crest;
})(window);

</script>
<script>
/* js/util.js */
/* ==========================================================================
   util.js — random helpers, formatting, small maths
   ========================================================================== */
(function (global) {
  'use strict';

  const U = {
    rnd(min, max) { return Math.random() * (max - min) + min; },
    int(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; },
    chance(p) { return Math.random() < p; },
    pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; },
    pickN(arr, n) {
      const copy = arr.slice(); const out = [];
      while (out.length < n && copy.length) out.push(copy.splice(Math.floor(Math.random() * copy.length), 1)[0]);
      return out;
    },
    weighted(pairs) { // [[value, weight], ...]
      let total = 0; pairs.forEach(p => total += p[1]);
      let r = Math.random() * total;
      for (const [v, w] of pairs) { r -= w; if (r <= 0) return v; }
      return pairs[pairs.length - 1][0];
    },
    clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); },
    round(v, dp) { const m = Math.pow(10, dp || 0); return Math.round(v * m) / m; },
    // Gaussian-ish via sum of uniforms
    gauss(mean, sd) {
      let s = 0; for (let i = 0; i < 6; i++) s += Math.random();
      return mean + ((s - 3) / 1.2) * sd;
    },
    poisson(lambda) {
      const L = Math.exp(-lambda); let k = 0, p = 1;
      do { k++; p *= Math.random(); } while (p > L);
      return k - 1;
    },
    shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
      return a;
    },
    money(v) {
      const n = Math.round(v);
      const abs = Math.abs(n);
      if (abs >= 1e9) return (n / 1e9).toFixed(2).replace(/\.00$/, '') + 'B';
      if (abs >= 1e6) return (n / 1e6).toFixed(2).replace(/\.00$/, '') + 'M';
      if (abs >= 1e3) return (n / 1e3).toFixed(0) + 'K';
      return String(n);
    },
    cash(v) { return '$' + U.money(v); },
    ordinal(n) {
      const s = ['th', 'st', 'nd', 'rd'], v = n % 100;
      return n + (s[(v - 20) % 10] || s[v] || s[0]);
    },
    pct(v) { return Math.round(v * 100) + '%'; },
    esc(str) {
      return String(str).replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    },
    id() { return Math.random().toString(36).slice(2, 10); }
  };

  global.U = U;
})(window);

</script>
<script>
/* js/state.js */
/* ==========================================================================
   state.js — game state: world creation, player creation, save/load, derived
   ========================================================================== */
(function (global) {
  'use strict';
  const D = global.DATA, U = global.U;

  const State = {
    game: null,

    /* ---------------- world ---------------- */
    buildWorld(startYear) {
      const clubs = {};
      const leagues = D.LEAGUES.map(L => {
        const ids = L.clubs.map(([name, rating, prestige]) => {
          const id = L.id + '-' + name.toLowerCase().replace(/[^a-z0-9]+/g, '').slice(0, 12);
          clubs[id] = {
            id, name, rating, baseRating: rating, prestige,
            league: L.id, country: L.country,
            morale: 70, form: [], trophies: 0
          };
          return id;
        });
        return { id: L.id, name: L.name, country: L.country, tier: L.tier,
                 cup: L.cup, cont: L.cont, clubs: ids };
      });
      return { year: startYear, clubs, leagues };
    },

    league(id) { return this.game.world.leagues.find(l => l.id === id); },
    club(id) { return this.game.world.clubs[id]; },
    clubsOf(leagueId) { return this.league(leagueId).clubs.map(id => this.club(id)); },

    /* ---------------- player ---------------- */

    overall(p, pos) {
      const w = D.POSITIONS[pos || p.pos].w;
      let sum = 0, total = 0;
      D.ATTR_KEYS.forEach(k => { sum += (p.attrs[k] || 0) * (w[k] || 0); total += (w[k] || 0); });
      return Math.round(U.clamp(total ? sum / total : 0, 20, 99));
    },

    // the overall you would have if every attribute reached its drafted ceiling
    potentialOverall(p) {
      return State.overall({ attrs: p.caps, pos: p.pos });
    },

    /* Build a player out of the attributes robbed during the draft.
       Each stolen number becomes the ceiling for that attribute; you start at
       roughly half of it and spend a career climbing. */
    createPlayer(opts) {
      const pos = opts.pos;
      const caps = {}, attrs = {};
      const ratio = D.CONFIG.DRAFT_START_RATIO;
      D.ATTR_KEYS.forEach(k => {
        const stolen = opts.caps && opts.caps[k];
        caps[k] = U.clamp(Math.round(stolen != null ? stolen : U.int(58, 72)), 30, 99);
        attrs[k] = U.clamp(Math.round(caps[k] * ratio + U.rnd(-3, 4)), 22, 82);
      });
      if (pos !== 'GK') { caps.gk = U.int(14, 24); attrs.gk = U.int(10, 18); }
      else if (!opts.caps || opts.caps.shooting == null) { caps.shooting = U.int(28, 44); attrs.shooting = U.int(18, 30); }

      const p = {
        firstName: opts.firstName, lastName: opts.lastName,
        nation: opts.nation, pos, foot: opts.foot || 'Right',
        shirt: opts.shirt || 10,
        age: opts.age || 17,
        height: U.int(pos === 'GK' ? 185 : 168, pos === 'GK' ? 199 : 194),
        attrs, caps,
        draft: opts.draft || [],
        traits: [],
        fitness: 100, form: 60, morale: 75, managerTrust: 55,
        reputation: 3,
        club: null, contract: null,
        season: State.blankSeason(),
        career: { apps: 0, goals: 0, assists: 0, motm: 0, yellow: 0, red: 0, cleanSheets: 0,
                  trophies: [], ratingSum: 0, seasons: [], clubs: [] },
        intl: { caps: 0, goals: 0, called: false, retired: false },
        injuries: [], suspension: 0, lastInjury: null,
        achievements: [], peakOvr: 0, peakValue: 0, legacy: 0, retired: false
      };
      p.ovr = State.overall(p);
      p.potential = State.potentialOverall(p);
      p.peakOvr = p.ovr;
      return p;
    },

    blankSeason() {
      return { apps: 0, goals: 0, assists: 0, motm: 0, yellow: 0, red: 0, cleanSheets: 0,
               ratingSum: 0, minutes: 0, benched: 0 };
    },

    seasonRating(p) {
      return p.season.apps ? U.round(p.season.ratingSum / p.season.apps, 2) : 0;
    },
    careerRating(p) {
      return p.career.apps ? U.round(p.career.ratingSum / p.career.apps, 2) : 0;
    },

    // Copero tracks what the market thinks you are worth — and your peak.
    marketValue(p) {
      const o = p.ovr, pot = State.potentialOverall(p);
      let v = Math.pow(Math.max(o - 40, 1), 3.05) * 380;
      const ageF = p.age <= 21 ? 1.55 : p.age <= 25 ? 1.3 : p.age <= 28 ? 1.0
                 : p.age <= 31 ? 0.62 : p.age <= 34 ? 0.3 : 0.12;
      v *= ageF;
      v *= 1 + Math.max(0, pot - o) * 0.022;
      v *= 0.8 + (p.form / 100) * 0.45;
      v *= 1 + p.reputation / 260;
      if (p.injuries.length) v *= 0.85;
      return Math.round(v / 10000) * 10000;
    },

    hasTrait(p, id) { return p.traits.indexOf(id) >= 0; },
    addTrait(p, id) { if (!State.hasTrait(p, id)) { p.traits.push(id); return true; } return false; },

    /* Reputation is football standing — what the game thinks of you. It comes
       from performances and trophies, never from anything off the pitch, and
       it fades if you stop earning it. */
    addReputation(p, amount) {
      const d = amount > 0 ? amount * (1 - p.reputation / 118) : amount;
      p.reputation = U.clamp(p.reputation + d, 0, 100);
      return p.reputation;
    },
    reputationBaseline(p, club) {
      return U.clamp((p.ovr - 56) * 2.6 + p.career.trophies.length * 2.5
        + (club ? club.prestige * 3 : 0) + p.career.goals * 0.05, 0, 100);
    },

    /* ---------------- new game ---------------- */
    newGame(playerOpts, clubId) {
      const world = State.buildWorld(D.CONFIG.SEASON_START_YEAR);
      const g = {
        version: 1,
        world,
        player: State.createPlayer(playerOpts),
        seasonIndex: 0,
        log: [],
        news: [],
        fixtures: [],
        fixtureIndex: 0,
        tables: {},
        cup: null,
        cont: null,
        intlTournament: null,
        weekActionsLeft: 1,
        awards: [],
        headlines: [],
        settings: { difficulty: playerOpts.difficulty || 'normal' },
        stage: 'season'
      };
      State.game = g;
      const club = world.clubs[clubId];
      Contracts.joinClub(g.player, club, Contracts.offerFor(g.player, club, true));
      return g;
    },

    log(text, kind) {
      const g = State.game; if (!g) return;
      g.log.unshift({ t: text, k: kind || 'info', season: g.world.year, id: U.id() });
      if (g.log.length > 400) g.log.length = 400;
    },
    // back-page headlines — Copero's press ticker
    news(headline, kind, source, icon) {
      const g = State.game; if (!g) return;
      g.headlines = g.headlines || [];
      g.headlines.unshift({ t: headline, k: kind || 'info', season: g.world.year,
                            src: source || U.pick(State.PAPERS), ic: icon || State.newsIcon(headline) });
      if (g.headlines.length > 140) g.headlines.length = 140;
    },
    // pick an icon for a headline nobody gave one to
    newsIcon(t) {
      const s = String(t).toLowerCase();
      const MAP = [
        ['hat-trick', 'ball'], ['brace', 'ball'], ['in a row', 'ball'], ['streak', 'ball'],
        ['game running', 'ball'], ['on target', 'goal'], ['wondergoal', 'goal'],
        ['goal of the', 'goal'], ['on the scoresheet', 'goal'],
        ['done deal', 'transfer'], ['new deal', 'contract'], ['sign', 'contract'], ['loan', 'transfer'],
        ['window', 'transfer'], ['on the move', 'transfer'], ['circle', 'transfer'], ['clause', 'contract'],
        ['champions', 'trophy'], ['lifts', 'trophy'], ['title', 'trophy'], ['cup', 'trophy'],
        ['ballon', 'star'], ['world player', 'star'], ['shortlist', 'star'], ['world xi', 'star'],
        ['player of the', 'medal'], ['named', 'medal'], ['award', 'medal'], ['golden boot', 'goldenboot'],
        ['call-up', 'nation'], ['allegiance', 'nation'], ['caps', 'nation'], ['national', 'nation'],
        ['sent off', 'card'], ['seeing red', 'card'], ['red card', 'card'], ['charged', 'whistle'],
        ['suffers', 'injury'], ['injur', 'injury'], ['weeks out', 'hospital'], ['scan', 'hospital'],
        ['returns', 'fitness'], ['back in training', 'fitness'],
        ['armband', 'crown'], ['captain', 'crown'],
        ['debut', 'academy'], ['year-old', 'academy'], ['wonderkid', 'academy'],
        ['retir', 'exit'], ['hangs up', 'exit'], ['an era', 'exit'],
        ['record', 'legacy'], ['milestone', 'legacy'], ['appearances', 'legacy'], ['centur', 'legacy'],
        ['promise', 'fans'], ['fans', 'fans'], ['terrace', 'fans'], ['badge', 'fans'],
        ['sacked', 'manager'], ['manager', 'manager'],
        ['rumour', 'microphone'], ['press', 'microphone'], ['leak', 'microphone']
      ];
      for (const [k, ic] of MAP) if (s.indexOf(k) >= 0) return ic;
      return 'news';
    },
    PAPERS: ['The Back Page', 'Radio Deportiva', 'Match Weekly', 'El Diario', 'Sky Touchline',
             'The Terrace', 'Gazzetta Live', 'Kicker Daily', 'Fútbol Total'],

    /* ---------------- persistence ---------------- */    save() {
      try {
        localStorage.setItem(D.CONFIG.SAVE_KEY, JSON.stringify(State.game));
        return true;
      } catch (e) { console.warn('save failed', e); return false; }
    },
    load() {
      try {
        const raw = localStorage.getItem(D.CONFIG.SAVE_KEY);
        if (!raw) return null;
        const g = JSON.parse(raw);
        if (!g || !g.player) return null;
        State.game = g;
        return g;
      } catch (e) { return null; }
    },
    hasSave() { try { return !!localStorage.getItem(D.CONFIG.SAVE_KEY); } catch (e) { return false; } },
    wipe() { try { localStorage.removeItem(D.CONFIG.SAVE_KEY); } catch (e) {} State.game = null; }
  };

  /* ==================== player names ====================
     A club's squad is mostly local with a scattering of imports, and every
     player's name matches the country he is from. That consistency is what
     makes a squad list read as real. */
  const Names = {
    pick(country) {
      const pool = D.NAMES[country] || D.NAMES.England;
      return U.pick(pool.first) + ' ' + U.pick(pool.last);
    },
    // choose where a player at this club is from
    nationFor(clubCountry) {
      const imports = D.IMPORT_POOLS[clubCountry] || [];
      const r = Math.random();
      if (r < 0.62 && D.NAMES[clubCountry]) return clubCountry;
      if (r < 0.9 && imports.length) return U.pick(imports);
      const all = Object.keys(D.NAMES);
      return U.pick(all);
    },
    // a full player identity for a squad member or a rival
    person(clubCountry) {
      const nation = Names.nationFor(clubCountry);
      return { name: Names.pick(nation), nation };
    }
  };

  global.Names = Names;

  /* ==================== contracts & wages ==================== */
  const Contracts = {
    wageFor(p, club, rookie) {
      const gap = p.ovr - (club.rating - 6);
      let base = Math.pow(Math.max(club.rating - 45, 4), 2.3) * 14;
      base *= U.clamp(1 + gap * 0.055, 0.28, 3.4);
      base *= 1 + p.reputation / 220;
      if (rookie) base *= 0.35;
      base *= (0.85 + Math.random() * 0.3);
      return Math.max(600, Math.round(base / 100) * 100); // weekly wage
    },
    offerFor(p, club, rookie) {
      const wage = Contracts.wageFor(p, club, rookie);
      const years = rookie ? U.int(2, 3) : U.int(2, 5);
      // a clause always has to be worth more than the contract itself
      const floor = Math.max(wage * 52 * 3, 1000000);
      return {
        wage, years,
        release: Math.max(floor, Math.round(State.marketValue(p) * U.rnd(1.6, 3.2) / 100000) * 100000)
      };
    },
    joinClub(p, club, offer) {
      p.club = club.id;
      p.wage = offer.wage;
      p.contract = { wage: offer.wage, years: offer.years, release: offer.release,
                     signed: State.game ? State.game.world.year : 0 };
      p.managerTrust = U.clamp(52 + (p.ovr - club.rating) * 1.5, 20, 88);
      if (p.career.clubs.indexOf(club.name) < 0) p.career.clubs.push(club.name);
    }
  };

  global.State = State;
  global.Contracts = Contracts;
})(window);

</script>
<script>
/* js/scenarios.js */
/* ==========================================================================
   scenarios.js — interactive in-match decision moments
   Every scenario returns options; each option resolves to an effects object
   consumed by engine.js.
   ========================================================================== */
(function (global) {
  'use strict';
  const D = global.DATA, U = global.U, State = global.State;

  /* ---------- style traits ----------
     Each option is given a style (from the moment it belongs to and the kind of
     choice it is), and a matching trait makes that style more likely to come
     off. This keeps the bonus in one place instead of in fifty probabilities. */
  const STYLE_TRAITS = {
    finesse:   { style: 'finesse',  attrs: ['shooting', 'dribbling'], mult: .12 },
    power:     { style: 'power',    attrs: ['shooting', 'physical'],  mult: .12 },
    poacher:   { style: 'poacher',  attrs: ['shooting'],              mult: .15 },
    aerial:    { style: 'aerial',   attrs: ['physical', 'shooting', 'defending'], mult: .13 },
    visionary: { style: 'vision',   attrs: ['passing'],               mult: .12 },
    burst:     { style: 'pace',     attrs: ['pace'],                  mult: .12 },
    pressres:  { style: 'pressres', attrs: ['dribbling', 'passing'],  mult: .15 },
    longrange: { style: 'longshot', attrs: ['shooting'],              mult: .18 },
    shotstop:  { style: 'shotstop', attrs: ['gk'],                    mult: .13 },
    sweeperk:  { style: 'sweeper',  attrs: ['gk', 'pace'],            mult: .13 }
  };

  // which style an option belongs to, from its moment and the choice it offers
  const TAG_STYLE = {
    // power
    'Power': 'power', 'Physical': 'power', 'Shooting': 'power', 'Risk': 'power',
    // finesse
    'Placement': 'finesse', 'Technique': 'finesse', 'Composure': 'finesse', 'Nerve': 'finesse',
    'Dribbling': 'finesse', 'Flair': 'finesse', 'Audacity': 'finesse', 'Icon': 'finesse',
    // vision
    'Passing': 'vision', 'Vision': 'vision', 'Smart': 'vision', 'Cunning': 'vision',
    'Delivery': 'vision', 'Set Piece': 'vision', 'Team Player': 'vision',
    // pace
    'Pace': 'pace', 'Work Rate': 'pace',
    // poaching
    'Instinct': 'poacher',
    // keeping
    'Goalkeeping': 'shotstop', 'Handling': 'shotstop', 'Reflex': 'shotstop', 'Patience': 'shotstop',
    'Bravery': 'sweeper', 'Commitment': 'sweeper',
    // the dark arts
    'Dark Arts': 'dive', 'Streetwise': 'dive'
  };
  const SCENARIO_STYLE = {
    header: 'aerial', aerial: 'aerial', volley: 'aerial',
    long_shot: 'longshot', keeper_rush: 'longshot',
    rebound: 'poacher', tight_angle: 'poacher',
    own_box: 'pressres', gk_backpass: 'pressres',
    gk_sweeper: 'sweeper', gk_distribution: 'sweeper',
    gk_save: 'shotstop', gk_longshot: 'shotstop', gk_wall: 'shotstop', gk_penalty: 'shotstop',
    dive: 'dive'
  };
  function styleFor(scn, opt) {
    return (opt && opt.style)
      || SCENARIO_STYLE[scn && scn.id]
      || TAG_STYLE[opt && opt.tag]
      || null;
  }
  function styleMult(ctx, attr) {
    if (!ctx.style) return 1;
    let m = 1;
    Object.keys(STYLE_TRAITS).forEach(id => {
      const t = STYLE_TRAITS[id];
      if (t.style === ctx.style && t.attrs.indexOf(attr) >= 0 && State.hasTrait(ctx.player, id)) m += t.mult;
    });
    return m;
  }

  /* ---------- helpers ---------- */
  function eff(ctx, attr) {
    const p = ctx.player;
    let raw = p.attrs[attr] || 20;
    // the ball does not always sit up on your good side
    if (ctx.weakSide && (attr === 'shooting' || attr === 'dribbling')) {
      const wf = p.attrs.weakFoot || 40;
      raw *= State.hasTrait(p, 'twofooted') ? 1 : (0.55 + (wf / 100) * 0.45);
    }
    const formF = 0.88 + (p.form / 100) * 0.24;
    const fitF = 0.82 + (p.fitness / 100) * 0.22;
    const nerve = ctx.pressure ? (State.hasTrait(p, 'ice') ? 1.0 : 0.94) : 1.0;
    return raw * formF * fitF * nerve * styleMult(ctx, attr);
  }

  // flair is what makes the outrageous option come off
  function flairBonus(ctx) {
    return ((ctx.player.attrs.flair || 50) - 58) * 0.005;

  function weakNote(ctx) {

  function luck(ctx, p) { return trait(ctx, 'lucky') ? Math.min(0.95, p + 0.05) : p; }

    return U.clamp((base || 0.5) + (value - opposition) * (k || 0.014), 0.04, 0.95);
  }
  function E(o) { // effects with defaults

  function penaltyOptions(ctx, onResult) {
    const gk = ctx.keeper;
    const skill = (eff(ctx, 'shooting') * 0.7 + (ctx.player.attrs.dribbling || 40) * 0.3)
      + (trait(ctx, 'ice') ? 12 : 0);
    const mk = (label, hint, base, tag) => ({
      label, hint, tag,
      run() {
        let p = luck(ctx, U.clamp(base + (skill - gk) * 0.006, 0.25, 0.96));
        if (ctx.pressure) p -= 0.05;
        const scored = U.chance(p);
        return onResult(scored, label);
      }
    });
    return [
      mk('Bottom left', 'Side-footed, low and hard.', 0.80, 'Placement'),
      mk('Top left', 'Unsaveable if you get it right.', 0.72, 'Risk'),
      mk('Straight down the middle', 'Nerve of steel required.', 0.74, 'Nerve'),
      mk('Bottom right', 'The classic. Keeper might guess.', 0.80, 'Placement'),
      mk('Top right', 'Postage stamp or the stands.', 0.72, 'Risk'),
      mk('Panenka', 'Chip it. Legend or clown.', 0.58 + flairBonus(ctx), 'Flair')
    ];
  }
